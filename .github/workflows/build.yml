name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # The runner image already ships the Android SDK; just accept licences.
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Restore signing key (keeps updates installable over the old app)
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > app/spinwise.keystore; fi
      # sideload = APK with in-app updates, play = bundle for Google Play (no network, no self-updater)
      - run: gradle assembleSideloadRelease bundlePlayRelease --no-daemon
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Spinwise-apk
          path: app/build/outputs/apk/sideload/release/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Spinwise-play-bundle
          path: app/build/outputs/bundle/playRelease/*.aab
      # Publish the APK to the PUBLIC releases repo so installed copies can find it.
      # Needs the RELEASES_TOKEN secret (see store/UPDATES.md); skipped quietly if it isn't set.
      - name: Publish update for in-app updates
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          RUN: ${{ github.run_number }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "RELEASES_TOKEN not set, skipping publish"; exit 0; fi
          APK=$(ls app/build/outputs/apk/sideload/release/*.apk | head -1)
          cp "$APK" "Spinwise-$RUN.apk"
          SHA=$(sha256sum "Spinwise-$RUN.apk" | cut -d' ' -f1)
          printf '%s\n\nsha256: %s\n' "${MSG:-New version}" "$SHA" > notes.txt
          gh release create "v1.0.$RUN" "Spinwise-$RUN.apk" --repo snipercreed/spinwise-releases --title "Spinwise 1.0.$RUN" --notes-file notes.txt
