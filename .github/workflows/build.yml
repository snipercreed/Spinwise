name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      # The runner image already ships the Android SDK; just accept licences.
      - name: Accept Android licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Restore signing key (keeps updates installable over the old app)
        env:
          KS_B64: ${{ secrets.KS_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then echo "$KS_B64" | base64 -d > app/spinwise.keystore; fi
      - run: gradle assembleRelease --no-daemon
        env:
          KS_PASSWORD: ${{ secrets.KS_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: Spinwise-apk
          path: app/build/outputs/apk/release/*.apk
