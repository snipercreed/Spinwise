<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Spinwise</title>
<link rel="stylesheet" href="motion.css">
<style>
/* Fonts (Fontshare FFL / OFL): Plus Jakarta Sans = body, Clash Display = headings & numbers, Chillax = buttons & labels */
@font-face{font-family:"Jakarta";src:url("fonts/PlusJakartaSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Clash";src:url("fonts/ClashDisplay-Semibold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Chillax";src:url("fonts/Chillax-Semibold.woff2") format("woff2");font-weight:600;font-display:swap}
:root{
  --font:"Jakarta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Clash","Jakarta",system-ui,sans-serif;
  --ui:"Chillax","Jakarta",system-ui,sans-serif;
  --bg:#eaeef4; --card:#ffffff; --ink:#12161a; --mute:#56626d; --line:rgba(20,30,40,.1);
  --acc:#1f8a4c; --acc2:#0f6b3a; --acc-ink:#ffffff; --acc-soft:rgba(31,138,76,.14); --glow:rgba(31,138,76,.45); --warn:#d98a1f; --hero1:#1f8a4c; --hero2:#0f6b3a;
  --l0:#e3e8e4; --l1:#bde5cb; --l2:#74c794; --l3:#2f9e5b; --l4:#16673a;
  --glass:rgba(255,255,255,.6); --glass-strong:rgba(255,255,255,.86); --gborder:rgba(255,255,255,.78);
  --gshadow:0 8px 30px rgba(31,45,61,.10),inset 0 1px 0 rgba(255,255,255,.95);
  --b1:#8fd3b0; --b2:#a9b8ff; --b3:#ffc9a0; --stage:rgba(110,125,140,.14); --sheetbg:rgba(255,255,255,.94);
}
:root[data-mode="dark"]{
  --bg:#0b0e12; --card:#171c21; --ink:#edf1f2; --mute:#9ba7af; --line:rgba(255,255,255,.09); --warn:#e7a23a;
  --l0:#222a2e;
  --glass:rgba(34,41,50,.56); --glass-strong:rgba(26,32,39,.82); --gborder:rgba(255,255,255,.13);
  --gshadow:0 10px 34px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.14);
  --stage:rgba(255,255,255,.05); --sheetbg:rgba(28,34,41,.95);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(112px + env(safe-area-inset-bottom));font-weight:400;font-synthesis:none}
.ambient{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--basebg,var(--bg))}
.ambient i{position:absolute;border-radius:50%;filter:blur(64px);opacity:.6}
.ambient i:nth-child(1){left:-18%;top:-6%;width:70vw;height:70vw;background:var(--b1)}
.ambient i:nth-child(2){right:-22%;top:22%;width:78vw;height:78vw;background:var(--b2)}
.ambient i:nth-child(3){left:6%;bottom:-24%;width:74vw;height:74vw;background:var(--b3)}
.ambient i:nth-child(4){right:-12%;bottom:-8%;width:56vw;height:56vw;background:var(--b4)}
.ambient i:nth-child(5){left:28%;top:36%;width:52vw;height:52vw;background:var(--b5);opacity:.45}
:root[data-mode="dark"] .ambient i{opacity:.5}
.glass,.card,.stat,.unit,.sc,.seg,.search,.toast,.wallet,.filters button,.list-glass{
  background:var(--glass);backdrop-filter:blur(26px) saturate(180%);-webkit-backdrop-filter:blur(26px) saturate(180%);border:1px solid var(--gborder);box-shadow:var(--gshadow)}
header{padding:16px 16px 4px;display:flex;gap:12px;align-items:center;max-width:640px;margin:0 auto}
header svg{width:44px;height:44px;flex:none;border-radius:13px;box-shadow:0 6px 18px rgba(0,0,0,.18)}
h1{font-size:22px;margin:0;letter-spacing:-.025em;line-height:1.12}
.sub{color:var(--mute);font-size:13px}
.wallet{min-height:44px;margin-left:auto;display:flex;align-items:center;gap:6px;border-radius:99px;padding:8px 14px;color:var(--ink);font-size:14px}
.wallet .gem{color:var(--acc)}
main{padding:6px 16px 16px;max-width:640px;margin:0 auto}
.card{border-radius:26px;padding:16px;margin-top:12px;position:relative}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border:1px solid rgba(255,255,255,.28);display:flex;gap:16px;align-items:center;overflow:hidden;box-shadow:0 14px 34px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.4)}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(120% 80% at 10% -10%,rgba(255,255,255,.32),transparent 55%);pointer-events:none}
.hero .sub{color:rgba(255,255,255,.82)}
.hero b.big{font-size:26px;letter-spacing:-.02em;display:block;line-height:1.1}
.ringwrap{position:relative;flex:none;z-index:1}
.hero>div:last-child{position:relative;z-index:1}
.ringwrap .lab{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;letter-spacing:-.02em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:rgba(255,255,255,.22);border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:3px 10px;font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{border-radius:22px;padding:12px}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--mute)}
button{font:inherit;border:0;border-radius:16px;padding:13px 16px;min-height:44px;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(255,255,255,.3),rgba(255,255,255,0) 62%),var(--acc);color:var(--acc-ink);cursor:pointer;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 6px 16px var(--glow)}
button.ghost{background:var(--glass);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);color:var(--ink);border:1px solid var(--gborder);box-shadow:var(--gshadow)}
button.link{background:none;box-shadow:none;color:var(--mute);padding:8px;font-size:13px}
button.small{padding:9px 13px;font-size:13px}
button:disabled{opacity:.45}
button.full{width:100%}
nav{position:fixed;left:14px;right:14px;bottom:calc(12px + env(safe-area-inset-bottom));display:flex;border-radius:30px;padding:6px;z-index:5;max-width:612px;margin:0 auto;
  background:var(--glass-strong);backdrop-filter:blur(30px) saturate(190%);-webkit-backdrop-filter:blur(30px) saturate(190%);border:1px solid var(--gborder);box-shadow:0 14px 40px rgba(0,0,0,.18),inset 0 1px 0 rgba(255,255,255,.5)}
nav button{flex:1;background:none;box-shadow:none;color:var(--mute);border-radius:24px;padding:9px 0 7px;font-size:12px}
nav button.on{color:var(--acc-text);background:var(--acc-soft)}
nav svg{display:block;margin:0 auto 2px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.subj{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding:2px 2px 4px}
.sc{min-height:44px;display:flex;align-items:center;gap:7px;padding:8px 14px;border-radius:99px;color:var(--ink);white-space:nowrap;font-size:13px;box-shadow:none}
.sc.on{box-shadow:inset 0 0 0 2px var(--c);border-color:var(--c)}
.dot{width:10px;height:10px;border-radius:99px;background:var(--c);display:inline-block;flex:none}
.wheelwrap{position:relative;width:min(100%,310px);margin:2px auto 14px;aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.ptr{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--ink);filter:drop-shadow(0 2px 3px rgba(0,0,0,.3));z-index:2}
.seg{display:flex;border-radius:16px;overflow:hidden;margin-bottom:12px;padding:3px;gap:3px;box-shadow:none}
.seg button{flex:1;border-radius:13px;background:transparent;box-shadow:none;color:var(--mute);padding:9px 6px;font-size:13px}
.seg button.on{background:var(--acc);color:var(--acc-ink);box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 4px 12px var(--glow)}
.topic{border-left:3px solid var(--c,var(--acc));padding:4px 0 4px 12px;margin:2px 0 14px}
.topic small{color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-size:12px}
.topic div{font-size:19px;letter-spacing:-.01em;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--l0);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.warn i{background:var(--warn)}
.search{width:100%;color:var(--ink);border-radius:18px;padding:12px 16px;font:inherit;margin-top:12px;box-shadow:none}
.filters{display:flex;gap:6px;margin-top:10px;overflow-x:auto;padding:2px}
.filters button,.sc{flex:none}
.filters button{padding:10px 14px;font-size:13px;color:var(--mute);white-space:nowrap;border-radius:99px;box-shadow:none}
.filters button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.unit{margin-top:12px;border-left:5px solid var(--sc,var(--gborder));border-radius:24px;overflow:hidden}
.unit>summary{list-style:none;padding:14px 16px;cursor:pointer}
.unit>summary::-webkit-details-marker{display:none}
.unit>summary em{font-style:normal;color:var(--mute);font-size:13px}
.unit>summary .bar{margin-top:9px;height:6px}
.unit .tag{font-size:12px;color:var(--mute)}
.item{display:flex;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer}
.badge{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:13px;flex:none;background:var(--l0);color:var(--ink)}
.badge[data-l="1"]{background:var(--l1)}.badge[data-l="2"]{background:var(--l2)}
.badge[data-l="3"]{background:var(--l3);color:#fff}.badge[data-l="4"]{background:var(--l4);color:#fff}
.item .t{line-height:1.25}
.item .m{font-size:12px;color:var(--mute)}
.pill{display:inline-block;font-size:12px;padding:1px 8px;border-radius:99px;background:var(--l1);color:var(--ink);margin-left:6px;vertical-align:middle;font-family:var(--ui)}
.pill.due{background:var(--warn);color:#fff}
.heat{overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;width:max-content}
.cell{width:13px;height:13px;border-radius:4px;background:var(--l0)}
.cell[data-l="1"]{background:var(--l1)}.cell[data-l="2"]{background:var(--l2)}
.cell[data-l="3"]{background:var(--l3)}.cell[data-l="4"]{background:var(--l4)}
.cell.future{visibility:hidden}.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.months{display:grid;grid-auto-flow:column;grid-auto-columns:16px;font-size:12px;color:var(--mute);height:16px;width:max-content}
.legend{display:flex;gap:4px;align-items:center;font-size:12px;color:var(--mute);justify-content:flex-end;margin-top:8px}
.legend .cell{width:11px;height:11px}
.tip{min-height:20px;font-size:13px;color:var(--mute);margin-top:8px}
textarea,input[type=text],input[type=date],select{width:100%;border:1px solid var(--line);border-radius:16px;background:rgba(127,140,150,.1);color:var(--ink);font:inherit;font-size:14px;padding:12px 14px}
textarea{min-height:130px;resize:vertical;font:13px/1.4 ui-monospace,Consolas,monospace}
pre{white-space:pre-wrap;background:rgba(127,140,150,.1);border:1px solid var(--line);border-radius:16px;padding:10px;font:12px/1.4 ui-monospace,Consolas,monospace;margin:8px 0;max-height:190px;overflow:auto}
h2{font-size:16px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:18px 0 8px}
p{margin:4px 0 10px;color:var(--mute);font-size:13px}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}
.empty svg{width:64px;height:64px;margin-bottom:10px}
details.how>summary{cursor:pointer;color:var(--acc-text);font-size:13px;margin:4px 0}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:9px 0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:44px;height:44px;padding:0;border-radius:12px}
label.check{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--mute);margin:6px 0;min-height:44px}
input[type=checkbox]{width:22px;height:22px;accent-color:var(--acc);flex:none}
.note-w{background:rgba(224,161,0,.16);border-radius:14px;padding:10px 12px;margin:8px 0;font-size:13px}
.list-row{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.list-row:first-of-type{border-top:0}
.list-row .t{flex:1;line-height:1.25}
.list-row .bar{width:70px;flex:none;height:6px}
.list-row .n{width:36px;text-align:right;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.rec{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.rec:first-of-type{border-top:0}
.rec .t{flex:1;line-height:1.25}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.sw{width:44px;height:44px;border-radius:99px;padding:0;background:var(--c);border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 4px 10px rgba(0,0,0,.18)}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
.sw.lock{opacity:.5;position:relative}
.sw.lock::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:14px}
/* shop */
.earn{display:grid;grid-template-columns:1fr auto;gap:2px 10px;font-size:13px}
.earn span:nth-child(even){text-align:right;color:var(--acc);font-family:var(--ui)}
.shopcat>summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;gap:10px;align-items:center}
.shopcat>summary::-webkit-details-marker{display:none}
.shopcat>summary em{font-style:normal;color:var(--mute);font-size:12px;margin-left:auto}
.opt{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:8px}
.opt .top{display:flex;gap:8px;align-items:center}
.opt .nm{flex:1;line-height:1.2}
.opt .ds{font-size:12px;color:var(--mute);margin-top:2px;font-family:var(--font);font-weight:400}
.tier{font:600 10.5px var(--ui);border-radius:99px;padding:2px 8px;background:var(--l0);color:var(--ink)}
.tier.t1{background:#cfe9ff;color:#0b3d6b}.tier.t2{background:#e3d4ff;color:#3f1d7a}.tier.t3{background:#ffe0b8;color:#7a3d00}.tier.t4{background:#ffd0dc;color:#7a0f2f}
.opt .btns{display:flex;gap:8px}
.opt .btns button{flex:1;padding:9px 10px;font-size:13px;border-radius:13px}
.lookgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px;margin-top:8px}
.look{border-radius:18px;padding:10px 6px 8px;text-align:center;font-size:12px;background:rgba(127,140,150,.1);border:1px solid var(--line);color:var(--ink);box-shadow:none}
.look .pv{height:34px;border-radius:12px;margin-bottom:6px}
.look.on{outline:2.5px solid var(--acc)}
.lookgrid.wide{grid-template-columns:repeat(2,1fr)}
.lookgrid.wide .pv{height:78px}
.look small{display:block;color:var(--mute);font-family:var(--font);font-weight:400}
/* sheet */
.scrim{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.scrim .dim{position:absolute;inset:0;background:rgba(5,10,15,.42)}
.sheet{position:relative;background:var(--glass-strong);backdrop-filter:blur(36px) saturate(190%);-webkit-backdrop-filter:blur(36px) saturate(190%);border:1px solid var(--gborder);border-bottom:0;width:100%;max-width:640px;border-radius:30px 30px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;box-shadow:0 -10px 50px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.5)}
.sheet .grab{width:38px;height:5px;border-radius:9px;background:var(--line);margin:-6px auto 14px}
.big-pct{font-size:44px;letter-spacing:-.03em;line-height:1}
input[type=range]{width:100%;accent-color:var(--acc);margin:12px 0 6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.pills button{padding:10px 13px;font-size:13px;background:rgba(127,140,150,.14);color:var(--ink);border:1px solid var(--line);box-shadow:none}
h1,h2,h3,.hero b.big,.big-pct,.stat b,.topic div,.ringwrap .lab,.badge,.chip{font-family:var(--display);font-weight:600}
b,strong,button,.item .t,.list-row .t,.rec .t,.toast,details.how>summary,.opt .nm,.look{font-family:var(--ui);font-weight:600}
input,select,.search{font-family:var(--font)}
.toastwrap{position:fixed;left:0;right:0;bottom:calc(104px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:70}
.toast{padding:11px 18px;border-radius:99px;font-size:13px;background:var(--glass-strong)}
.m-fx{position:fixed;inset:0;z-index:80}
.m-hl{background-size:0% 100%}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sheet .m-hl,.topic .m-hl{background-size:100% 100%}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="ambient"><i></i><i></i><i></i><i></i><i></i></div>
<header>
  <div id="logo"></div>
  <div><h1 id="title">Spinwise</h1><div class="sub" id="subtitle"></div></div>
  <button class="wallet" id="wallet" data-a="tab" data-v="shop"><span class="gem">✦</span><b id="wv">0</b></button>
</header>
<main id="main"></main>
<nav id="nav"></nav>
<div class="m-fx" id="fx" style="pointer-events:none"></div>
<div class="toastwrap" id="toastwrap"></div>

<script src="motion.js"></script>
<script>
/* ================= data ================= */
const KEY = "spinwise.v2";
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const z2 = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+z2(d.getMonth()+1)+"-"+z2(d.getDate());
const today = () => ymd(new Date());
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PAL = ["#e5484d","#f76b15","#e0a100","#30a46c","#12a594","#3e63dd","#8e4ec6","#d6409f","#6f7a83"];
const M = window.MOTION;
let S, tab = "today", spinning = false, rotDeg = 0, wheelSlices = [];
let flt = "all", selDay = null, editSid = null, editColor = PAL[0], shopTab = "motion", tabDir = 1, lastPt = null; const openUnits = new Set(), openShop = new Set();
let idleStops = [];

const own_ = (o,k) => Object.prototype.hasOwnProperty.call(o,k);
/* ----- free accent colours (used by the Clear theme) ----- */
const ACCENTS = {
  forest:{n:"Forest",l:["#1f8a4c","#0f6b3a"],d:["#3fb96f","#1f8a4c"]},
  ocean:{n:"Ocean",l:["#1d6fd1","#114b9a"],d:["#58a6ff","#1d6fd1"]},
  violet:{n:"Violet",l:["#7a48d8","#53289f"],d:["#a78bfa","#7a48d8"]},
  sunset:{n:"Sunset",l:["#e0662a","#b0431a"],d:["#ff9a5c","#e0662a"]},
  rose:{n:"Rose",l:["#d6336c","#a31d4c"],d:["#ff7ba5","#d6336c"]},
  slate:{n:"Slate",l:["#3f4a54","#1d252c"],d:["#aeb8c2","#6b7783"]}
};
/* ----- cosmetics earned with ✦: glass themes (blurred gradient backdrops), wheel skins, heatmap palettes ----- */
const G = (base,b) => ({ base, b });
const THEMES = {
  clear:{n:"Clear",price:0,acc:null,hero:null,
    L:G("linear-gradient(160deg,#f3f6fa,#e6ebf2)",["#b8d9ff","#d6c8ff","#ffd9c2","#c9f0dc","#f5f7fb"]),
    D:G("linear-gradient(160deg,#0d1116,#0a0d11)",["#16324f","#2b2552","#3a2a30","#15382f","#10151b"])},
  aurora:{n:"Aurora",price:120,acc:[["#1fa56a","#0b7a4b"],["#46d68f","#1fa56a"]],hero:["#1fa56a","#2a6fd6"],
    L:G("linear-gradient(160deg,#e9fbf3,#e6eeff)",["#7fe3b6","#8fb8ff","#c1a9ff","#a6f0e0","#ffe3c9"]),

function bytesToB64u(u8){ let s = ""; for (let i=0;i<u8.length;i+=0x8000) s += String.fromCharCode.apply(null, u8.subarray(i,i+0x8000)); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64uToBytes(str){ str = str.replace(/-/g,"+").replace(/_/g,"/"); while (str.length%4) str += "="; const bin = atob(str), u8 = new Uint8Array(bin.length); for (let i=0;i<bin.length;i++) u8[i] = bin.charCodeAt(i); return u8; }
async function pipeBytes(u8, stream){ const w = stream.writable.getWriter(); w.write(u8); w.close(); return new Uint8Array(await new Response(stream.readable).arrayBuffer()); }
async function encodeShare(sub){
  const units = []; S.topics.filter(t=>t.sid===sub.id).forEach(t => { let u = units.find(x=>x[0]===t.unit); if (!u) { u = [t.unit,[]]; units.push(u); }
    u[1].push((t.notes || (t.rel&&t.rel.length)) ? [t.title, t.notes||"", t.rel||[]] : t.title); });
  const raw = new TextEncoder().encode(JSON.stringify({ v:1, s:sub.name, e:sub.examDate||"", u:units }));
  try { if (window.CompressionStream) return "SW2:" + bytesToB64u(await pipeBytes(raw, new CompressionStream("gzip"))); } catch(e){}
  return "SW1:" + bytesToB64u(raw);
}
async function decodeShare(code){
  const m = code.match(/SW([12]):([A-Za-z0-9_-]+)/); if (!m) return null;
  let u8 = b64uToBytes(m[2]); if (m[1]==="2") u8 = await pipeBytes(u8, new DecompressionStream("gzip"));
  const j = JSON.parse(new TextDecoder().decode(u8)), topics = [];
  (j.u||[]).forEach(([un,list]) => list.forEach(t => { const x = typeof t==="string" ? { title:t } : { title:t[0], notes:t[1]||"", related:t[2]||[] }; const tt = toTopic(x,un); if (tt) topics.push(tt); }));
  return { specs:[{ subject:j.s||"", examDate:normDate(j.e), topics }], warn:["Shared from another Spinwise. It includes the topics, not their progress."] };
}
async function parseAnyAsync(text){
  if (/SW[12]:[A-Za-z0-9_-]{8,}/.test(text||"")) { try { const r = await decodeShare(text); if (r && r.specs[0].topics.length) return r; } catch(e){} }
  return parseAny(text);
}

}

const SYNCKEY = "spinwise.sync";
const SY = { meta:(() => { try { return JSON.parse(localStorage.getItem(SYNCKEY)) || {}; } catch(e){ return {}; } })(), timer:null, remote:null };
SY.meta.device = SY.meta.device || ("d" + Math.random().toString(36).slice(2,10));
const syncAvail = () => !!(window.Android && Android.syncRead);
const saveMeta = () => { try { localStorage.setItem(SYNCKEY, JSON.stringify(SY.meta)); } catch(e){} };
function packState(){ return JSON.stringify({ app:"spinwise", v:1, updated:S.updated||0, device:SY.meta.device, data:S }); }
function schedulePush(){ if (!syncAvail() || !SY.meta.linked) return; clearTimeout(SY.timer); SY.timer = setTimeout(pushSync, 2500); }
function pushSync(){ try { if (!SY.meta.linked || !syncAvail()) return; Android.syncWrite(packState()); SY.meta.lastPush = Date.now(); SY.meta.lastSeen = S.updated||0; SY.meta.lastRemote = S.updated||0; saveMeta(); } catch(e){} }
function readRemote(){ try { const raw = Android.syncRead(); if (!raw) return null; if (raw.length>6e6) return null; const j = JSON.parse(raw); return j && j.app==="spinwise" && j.data && Array.isArray(j.data.topics) ? j : null; } catch(e){ return null; } }
function pullSync(initial){
  if (!syncAvail() || !SY.meta.linked) return;
  const r = readRemote();
  if (!r) { if (initial && S.topics.length) pushSync(); return; }
  if (r.device===SY.meta.device) return;                          // that's our own last write
  if ((r.updated||0) <= (SY.meta.lastRemote||0)) return;          // nothing new
  const localChanged = (S.updated||0) > (SY.meta.lastSeen||0);
  if (!localChanged || !S.topics.length) { adoptRemote(r); return; }
  SY.remote = r; openConflict(r);
}
function adoptRemote(r){
  S = cleanState(r.data); S.updated = r.updated; SY.meta.lastRemote = r.updated; SY.meta.lastSeen = r.updated; saveMeta(); persistLocal(); wheelSlices = []; closeModal(); render(false,false); toast("Synced from your other device");
}
function describe(d, updated){ const n = (d.topics||[]).length; return `${n} topics · ${d.coins||0} ✦ · ${(d.log||[]).length} revisions${updated?" · "+new Date(updated).toLocaleString("en",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"}):""}`; }
function openConflict(r){
  modal(`<h2>Two versions found</h2><p>This device and your cloud copy both changed since the last sync. Choose which to keep. The other is replaced.</p>
    <div class="card" style="margin:8px 0;padding:12px 14px"><b>This device</b><div class="sub">${esc(describe(S,S.updated))}</div></div>
    <div class="card" style="margin:8px 0;padding:12px 14px"><b>Cloud copy</b><div class="sub">${esc(describe(r.data,r.updated))}</div></div>
    <div class="row" style="margin-top:12px"><button class="ghost sp" data-a="keeplocal">Keep this device</button><button class="sp" data-a="usecloud">Use cloud copy</button></div>`);
}
window.onSyncLinked = (create, name) => { SY.meta.linked = true; SY.meta.name = name; SY.meta.lastRemote = 0; SY.meta.lastSeen = 0; saveMeta();
  if (create) { S.updated = Date.now(); persistLocal(); pushSync(); toast("Sync file created"); } else { pullSync(true); toast("Sync file linked"); } if (tab==="more") render(true); };
window.onAppResume = () => { pullSync(false); autoCheck(); };

const updAvail = () => { try { return !!(window.Android && Android.updaterEnabled && Android.updaterEnabled()); } catch(e){ return false; } };
const updGet = k => { try { return +localStorage.getItem(k)||0; } catch(e){ return 0; } };
const updSet = (k,v) => { try { localStorage.setItem(k,String(v)); } catch(e){} };
function updCheck(manual){
  if (!updAvail() || UPD.busy || UPD.checking) return;
  UPD.checking = true; UPD.msg = manual ? "Checking…" : "";
  try { Android.updateCheck(); } catch(e){ UPD.checking = false; }
  if (manual && tab==="more") render(true);
}
window.onUpdateInfo = json => {
  UPD.checking = false; let i = null; try { i = JSON.parse(json); } catch(e){}
  UPD.info = i; updSet("spinwise.upd.t", Date.now());
  if (!i) UPD.msg = "Couldn't check for updates.";
  else if (i.error) UPD.msg = i.error==="no releases yet" ? "No updates published yet." : "Couldn't check for updates ("+i.error+").";
  else UPD.msg = i.available ? "" : "You're up to date.";
  if (tab==="today" || tab==="more") render(true);
};
window.onUpdateProgress = p => { UPD.pct = p; const b = $("#updbar"), t = $("#updpct"); if (b) b.style.width = p+"%"; if (t) t.textContent = p+"%"; };
window.onUpdateStatus = s => {
  UPD.busy = s==="downloading" || s==="installing";
  if (s==="downloading") UPD.msg = "Downloading…";
  else if (s==="installing") UPD.msg = "Follow Android's prompt to finish installing.";
  else if (s==="needs-permission") UPD.msg = "Allow Spinwise to install updates in the settings screen that just opened, then tap Update again.";
  else if (s.indexOf("error:")===0) UPD.msg = "Update failed: " + s.slice(6) + ".";
  else UPD.msg = s;
  if (tab==="today" || tab==="more") render(true);
};
function autoCheck(){
  if (!updAvail() || S.autoUpdate===false) return;
  if (Date.now() - updGet("spinwise.upd.t") > 12*3600e3) updCheck(false);
}
function updPending(){ const i = UPD.info; return i && i.available ? i : null; }
function updProgressHTML(){ return UPD.busy ? `<div class="bar" style="margin-top:10px"><i id="updbar" style="width:${UPD.pct}%"></i></div><div class="sub" style="margin-top:4px"><span id="updpct">${UPD.pct}%</span> · ${esc(UPD.msg)}</div>` : (UPD.msg ? `<div class="sub" style="margin-top:8px">${esc(UPD.msg)}</div>` : ""); }
function updBanner(){
  const i = updPending(); if (!i || i.versionCode <= updGet("spinwise.upd.d")) return "";
  return `<div class="card" style="margin-top:12px"><div class="row"><div class="sp"><b>Update available</b><div class="sub">Version ${esc(i.version)}${i.size?" · "+(i.size/1048576).toFixed(1)+" MB":""}</div></div>
    <button class="small" data-a="updnow" ${UPD.busy?"disabled":""}>Update</button><button class="link" data-a="upddismiss">Later</button></div>${updProgressHTML()}</div>`;
}
function updateCard(){
  if (!updAvail()) return "";
  const i = updPending(); let ver = ""; try { ver = Android.appVersion(); } catch(e){}
  return `<div class="card"><h2>App updates</h2><p>${ver?"You have version "+esc(ver)+". ":""}${i?"<b>Version "+esc(i.version)+" is ready.</b>":"Spinwise looks for new versions on GitHub."}</p>
    ${i&&i.notes?`<div class="sub" style="margin-bottom:8px;white-space:pre-line">${esc(i.notes.slice(0,400))}</div>`:""}
    <div class="row">${i?`<button class="sp" data-a="updnow" ${UPD.busy?"disabled":""}>Update now</button>`:`<button class="ghost sp" data-a="updcheck" ${UPD.checking||UPD.busy?"disabled":""}>Check for updates</button>`}</div>
    ${updProgressHTML()}
    <label class="check"><input type="checkbox" data-a="updauto" ${S.autoUpdate===false?"":"checked"}> Check automatically when I open the app</label></div>`;
}

const MILESTONES = {3:10,7:20,14:40,30:80,60:150,100:300};

  t.pct = pct; t.revs++; t.last = today(); t.fr = true; if (notes!==undefined) t.notes = notes;

    const raw = REWARD.base + Math.min(REWARD.streakCap,Math.floor(st/2)) + (gain>=20?REWARD.gain:0) + (due?REWARD.due:0) + (first?REWARD.first:0);
    c = Math.round(raw*k);

    if (L.n===S.goal) { const g = Math.min(REWARD.goalCap, S.goal*REWARD.goalPer); c += g; extra.push("Daily goal +"+g); }
    if (MILESTONES[st] && !S.ms[st] && L.n===1) { c += MILESTONES[st]; S.ms[st] = 1; e.ms = st; extra.push(st+"-day streak +"+MILESTONES[st]); }
  } else { L.ids[id] = seen+1; extra.push("already counted today"); }
  e.c = c; S.coins += c; S.life += c; save();
  return { c, extra };
}
function undoRevision(id){

    if (e.c) { S.coins = Math.max(0,S.coins-e.c); S.life = Math.max(0,S.life-e.c); } if (e.ms) delete S.ms[e.ms];
    const L = ledger(); if (L.ids[id]) { L.ids[id]--; if (L.ids[id]<=0) { delete L.ids[id]; L.n = Math.max(0,L.n-1); } }
    S.log.splice(i,1); save(); return true; }
  return false;
}

function drawWheel(){
  const cv = $("#wheel"); if (!cv) return;
  const size = cv.clientWidth, dpr = window.devicePixelRatio||1; cv.width = size*dpr; cv.height = size*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const cs = getComputedStyle(document.documentElement), g = k => cs.getPropertyValue(k).trim();
  const ink = g("--ink"), line = g("--line"), card = g("--card"), dark = document.documentElement.dataset.mode==="dark", base = dark?"#161a1d":"#ffffff", sk = S.wskin;
  const R = size/2-6, n = wheelSlices.length||1, a = Math.PI*2/n, rot = rotDeg*Math.PI/180;
  ctx.clearRect(0,0,size,size);

  ctx.beginPath(); ctx.arc(size/2,size/2,R+3,0,7); ctx.fillStyle = card; ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(size/2,size/2); ctx.rotate(rot);

    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a); ctx.closePath();
    let fill, stroke = card, txt = ink;

    else if (sk==="mono") fill = mix("#8a949b", base, (dark?.3:.22)+odd*.1);
    else if (sk==="neon") { fill = mix(c,"#0b0e12",.14+odd*.07); stroke = c; txt = "#ffffff"; }
    else fill = mix(c, base, (dark?.3:.18)+odd*.12);
    ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = stroke; ctx.lineWidth = sk==="neon"?1.5:2; if (sk==="neon") { ctx.shadowColor = c; ctx.shadowBlur = 8; } ctx.stroke(); ctx.shadowBlur = 0;
    if (sk==="mono") { ctx.beginPath(); ctx.arc(0,0,R-1,-Math.PI/2+i*a+.03,-Math.PI/2+(i+1)*a-.03); ctx.strokeStyle = c; ctx.lineWidth = 4; ctx.stroke(); }
    ctx.save(); ctx.rotate(-Math.PI/2+(i+.5)*a); ctx.textAlign="right"; ctx.textBaseline="middle";
    ctx.fillStyle = txt; ctx.font = '600 12px Chillax, Jakarta, sans-serif';
    let t = sl.title||""; const max = Math.floor(R*0.62/6.2); if (t.length>max) t = t.slice(0,max-1)+"…";
    ctx.fillText(t, R-14, 0); ctx.restore();
  }
  ctx.restore();
  const grad = ctx.createLinearGradient(0,0,size,size); grad.addColorStop(0,"rgba(255,255,255,.75)"); grad.addColorStop(.5,"rgba(255,255,255,.05)"); grad.addColorStop(1,"rgba(255,255,255,.4)");
  ctx.beginPath(); ctx.arc(size/2,size/2,R,0,7); ctx.strokeStyle = grad; ctx.lineWidth = 2.5; ctx.stroke();
  ctx.beginPath(); ctx.arc(size/2,size/2,18,0,7); ctx.fillStyle = card; ctx.fill(); ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.stroke();
  ctx.beginPath(); ctx.arc(size/2,size/2,5.5,0,7); ctx.fillStyle = g("--acc"); ctx.fill();
}
function pool(){ const p = vis().filter(t=>t.pct<100); return p.length ? p : vis(); }
function weight(t, last){
  const w = ((100-t.pct)+8) * (t.last===today() ? .15 : 1) * (isDue(t) ? 1.8 : 1);

}
function weightedWinner(){
  const last = lastTopic(), p = pool().filter(t => !last || t.id!==last.id || pool().length===1), w = p.map(t => weight(t,last));

  for (let i=0;i<p.length;i++){ r -= w[i]; if (r<=0) return p[i]; } return p[p.length-1];
}

    cells += `<div class="cell ${fut?"future":""} ${k===selDay?"sel":""}" data-l="${l}" data-d="${k}" data-c="${c}"></div>`;
  }
  const items = vis(), weak = items.slice().sort((a,b)=>a.pct-b.pct).slice(0,5);
  const groups = []; items.forEach(t => { const k = t.sid+"|"+t.unit; let u = groups.find(x=>x.k===k); if(!u){u={k,unit:t.unit,sid:t.sid,items:[]};groups.push(u);} u.items.push(t); });
  const wk = S.log.filter(e=>sinceDays(e.d)<7).length, pw = S.log.filter(e=>{const n=sinceDays(e.d);return n>=7&&n<14}).length;
  const recent = S.log.slice(-5).reverse();
  return subjBar() + `<div class="stats"><div class="stat"><b>${st.cur}</b><span>current streak</span></div><div class="stat"><b>${st.best}</b><span>best streak</span></div><div class="stat"><b>${active}</b><span>days tracked</span></div></div>
    <div class="card"><div class="row" style="margin-bottom:10px"><b>${total} revision${total===1?"":"s"} logged</b><span class="sp"></span><span class="sub">${wk} this week · ${pw} last week</span></div>
      <div class="heat" id="heat"><div class="months">${months}</div><div class="grid">${cells}</div></div><div class="tip" id="tip">Tap a day for details.</div>
      <div class="legend">Less ${[0,1,2,3,4].map(l=>`<div class="cell" data-l="${l}"></div>`).join("")} More</div></div>
    ${ex?`<div class="card"><div class="row"><div class="big-pct">${ex.d}</div><div><b>days until ${esc(ex.name)}</b><div class="sub">${items.filter(t=>t.pct<70).length} topics below 70%</div></div></div></div>`:""}
    ${S.view==="all"&&S.subjects.length>1?`<h3>Subjects</h3><div class="card" style="margin-top:0">${S.subjects.map(s=>{const p=avg(S.topics.filter(t=>t.sid===s.id));return `<div class="list-row" data-a="view" data-v="${s.id}" style="cursor:pointer"><i class="dot" style="--c:${s.color}"></i><div class="t">${esc(s.name)}</div><div class="bar"><i style="width:${p}%;background:${s.color}"></i></div><div class="n">${p}%</div></div>`}).join("")}</div>`:""}
    <h3>Units</h3><div class="card" style="margin-top:0">${groups.map(u=>{const p=avg(u.items),s=subj(u.sid)||{color:"#6f7a83"};return `<div class="list-row"><i class="dot" style="--c:${s.color}"></i><div class="t">${esc(u.unit)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="n">${p}%</div></div>`}).join("")}</div>
    <h3>Needs work</h3><div class="card" style="margin-top:0">${weak.map(t=>`<div class="list-row" data-a="revise" data-v="${t.id}" style="cursor:pointer"><i class="dot" style="--c:${colorOf(t)}"></i><div class="t">${esc(t.title)}</div><div class="bar warn"><i style="width:${t.pct}%"></i></div><div class="n">${t.pct}%</div></div>`).join("")}</div>
    ${recent.length?`<h3>Recent</h3><div class="card" style="margin-top:0">${recent.map(e=>{const t=S.topics.find(x=>x.id===e.id);return t?`<div class="list-row"><i class="dot" style="--c:${colorOf(t)}"></i><div class="t">${esc(t.title)}</div><div class="n" style="width:auto">${e.d.slice(5)}</div></div>`:""}).join("")}</div>`:""}`;
}
function viewMore(){
  return `<div class="card"><h2>Load from Claude</h2><p>Claude already knows your subjects. Copy this prompt into a regular Claude chat, then paste its reply below. Every subject comes in at once, with colours, related topics and starting confidence.</p>
      <button class="full" data-a="cp-in">Copy prompt for Claude</button>
      <details class="how"><summary>See the prompt</summary><pre>${esc(PROMPT_IN)}</pre></details>
      <textarea id="paste" style="margin-top:10px" placeholder='Paste Claude&#39;s reply here'></textarea>
      <input type="text" id="isn" list="sl" style="margin-top:8px" placeholder="Subject name (only if Claude's reply doesn't include one)"><datalist id="sl">${S.subjects.map(s=>`<option value="${esc(s.name)}">`).join("")}</datalist>
+

      <button class="full" style="margin-top:10px" data-a="import">Review import</button><button class="link" data-a="bulk" style="width:100%">or paste a plain list of topics</button><div class="msg" id="imsg"></div></div>
    <div class="card"><h2>Tell Claude how it's going</h2><p>Copies your % revised per subject, streak, due topics, weak spots and full data. Paste it into Claude and it can acknowledge your progress and say what to do next.</p>
      <button class="ghost full" data-a="cp-out" ${S.topics.length?"":"disabled"}>Copy progress for Claude</button></div>
    <div class="card"><div class="row"><h2 class="sp">Subjects</h2><button class="ghost small" data-a="subj-new">+ Add</button></div><p>Each subject gets its own colour on the wheel and in your lists.</p>
      ${S.subjects.length?S.subjects.map(s=>`<div class="list-row" data-a="subj-edit" data-v="${s.id}" style="cursor:pointer"><i class="dot" style="--c:${s.color};width:14px;height:14px"></i><div class="t">${esc(s.name)}<div class="sub" style="font-family:var(--font);font-weight:400">${S.topics.filter(t=>t.sid===s.id).length} topics${s.examDate?" · exam "+esc(s.examDate):""}</div></div><span class="sub">Edit</span></div>`).join(""):`<div class="sub">No subjects yet.</div>`}</div>
    ${updateCard()}${syncCard()}${shareCard()}<div class="card"><h2>Appearance</h2>
      <div class="sub" style="margin:6px 0">Mode</div>
      <div class="seg glass">${[["system","System"],["light","Light"],["dark","Dark"]].map(([k,l])=>`<button class="${S.mode===k?"on":""}" data-a="mode" data-v="${k}">${l}</button>`).join("")}</div>
      <div class="sub" style="margin:4px 0 6px">Accent colour${S.theme!=="clear"?" · your glass theme sets its own":""}</div>
      <div class="swatches">${Object.keys(ACCENTS).map(k=>`<button class="sw ${S.accent===k?"on":""}" style="--c:${ACCENTS[k].l[0]}" data-a="accent" data-v="${k}" aria-label="${ACCENTS[k].n}"></button>`).join("")}</div>
      <label class="check"><input type="checkbox" data-a="dynicon" ${S.dynIcon?"checked":""}> Match the launcher icon to my theme (experimental)</label>
      <div class="row"><div class="sp sub">Glass theme: <b style="color:var(--ink)">${esc(THEMES[S.theme].n)}</b></div><button class="ghost small" data-a="tab" data-v="shop">Browse themes</button></div></div>
    <div class="card"><h2>Motion</h2><p>Every animation is free. Pick any of 55 effects, or turn animation off.</p><button class="ghost full" data-a="tab" data-v="motion">Customise motion</button></div>
<div class="card"><h2>Daily goal</h2>
      <div class="lbl"><span>Topics per day</span><span class="stepper"><button data-a="goal" data-v="-1">−</button><b id="gv">${S.goal}</b><button data-a="goal" data-v="1">+</button></span></div></div>
    <div class="card"><h2>Backup</h2><p>Copy all your data (including ✦, unlocks and equipped motion) to keep it safe. To restore, paste a backup into the box above and press Import. Updates keep your data automatically; a backup is only needed if you ever uninstall the app.</p>
      <div class="row"><button class="ghost small sp" data-a="backup">Copy backup</button><button class="ghost small sp" data-a="resetp">Reset progress</button></div></div>
    <div class="card"><h2>About Spinwise</h2><p>Everything you enter stays on this device. Spinwise has no account, no ads and no analytics. ${updAvail()?"This build checks GitHub for new versions, and nothing else uses the network.":"It has no internet permission."} Sync and sharing only run when you choose them.</p>
      <details class="how"><summary>Privacy summary</summary><p>Stored on this device: your subjects, topics, notes, revision history, ✦ and settings. Nothing is sent to the developer. If you turn on sync, the app writes your data to a file in the cloud storage app you pick, and that provider's policy applies to the file. Share sends text only to the app you choose. Delete the app, or use the button below, to remove local data.</p></details>
      <details class="how"><summary>Fonts and licences</summary><p>Clash Display and Chillax © Indian Type Foundry, used under the ITF Free Font License (fontshare.com). Plus Jakarta Sans © Tokotype, SIL Open Font License 1.1. The full licence texts are bundled with the app.</p></details>
      <p>Spinwise is an independent app. It isn't affiliated with or endorsed by Anthropic. Claude is a trademark of Anthropic.</p>
      <button class="ghost small full" data-a="wipe">Delete all my data</button></div>`;
}
function title(){
  if (tab==="shop") return "Shop"; if (tab==="motion") return "Motion";
  if (S.view!=="all") return (subj(S.view)||{}).name || "Spinwise";
  return S.subjects.length===1 ? S.subjects[0].name : "Spinwise";
}
function render(keep, entry){
  applyTheme();
  $("#logo").innerHTML = logo();
  $("#title").textContent = title();
  $("#subtitle").textContent = new Date().toLocaleDateString("en",{weekday:"long",day:"numeric",month:"long"});
  $("#wv").textContent = S.coins;
  stopIdle();
  $("#main").innerHTML = tab==="today"?viewToday(keep):tab==="list"?viewList():tab==="prog"?viewProg():tab==="shop"?viewShop():tab==="motion"?viewMotion():viewMore();
  renderNav();
  if (tab==="today") drawWheel();
  if (tab==="list") {
    document.querySelectorAll("details.unit").forEach(d => d.addEventListener("toggle", () => d.open ? openUnits.add(d.dataset.u) : openUnits.delete(d.dataset.u)));
    const q = $("#q"); if (q) q.addEventListener("input", () => { const v = q.value.toLowerCase().trim();
      document.querySelectorAll("details.unit").forEach(d => { let any = false;
        d.querySelectorAll(".item").forEach(i => { const show = !v || i.dataset.s.includes(v); i.style.display = show?"":"none"; any = any||show; });
        d.style.display = any?"":"none"; if (v && any) d.open = true; }); });
  }
  if (tab==="motion") document.querySelectorAll("details.shopcat").forEach(d => d.addEventListener("toggle", () => d.open ? openShop.add(d.dataset.sc) : openShop.delete(d.dataset.sc)));
  if (tab==="prog") { const h = $("#heat"); if (h) h.scrollLeft = h.scrollWidth;
    document.querySelectorAll(".cell[data-d]").forEach(c => c.onclick = () => {
      document.querySelectorAll(".cell.sel").forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); selDay = c.dataset.d;
      const dt = new Date(c.dataset.d+"T00:00:00").toLocaleDateString("en",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
      const names = S.log.filter(e=>e.d===c.dataset.d).map(e=>(S.topics.find(t=>t.id===e.id)||{}).title).filter(Boolean);
      $("#tip").innerHTML = `<b style="color:var(--ink)">${names.length} revision${names.length===1?"":"s"}</b> on ${dt}`+(names.length?`<br>${names.map(esc).join(" · ")}`:""); }); }
  syncIcon();
  if (entry) runEntry();
  if (tab==="today") startIdle();
}

/* ================= actions ================= */
const TABS = ["today","list","prog","shop","more","motion"];
const act = {
  tab(v){ if (spinning) return; tabDir = TABS.indexOf(v) >= TABS.indexOf(tab) ? 1 : -1; tab = v; render(false,true); window.scrollTo(0,0); },
  view(v){ if (spinning) return; S.view = v==="all" ? "all" : +v; wheelSlices = []; save(); render(false,true); },
  wmode(v){ S.wmode = v; wheelSlices = []; save(); render(); },
  spin(){ spin(); },
  skip(){ S.pick = null; save(); render(); },
  again(){ S.pick = null; save(); render(); },
  undo(v){ const from = S.coins; undoRevision(+v); render(); countWallet(from,S.coins); toast("Revision undone"); },
  revise(v){ openRevise(+v); },
  close(){ closeModal(); },
  setpct(v){ $("#rg").value = v; $("#rg").dispatchEvent(new Event("input")); },
  dolog(v){ const from = S.coins, pt = lastPt; const r = logRevision(+v,+$("#rg").value,$("#nt").value.trim()); closeModal(); wheelSlices = []; render(); countWallet(from,S.coins);
    if (r) { toast(`+${r.c} ✦${r.extra.length?" · "+r.extra.join(" · "):""}`); setTimeout(()=>celebrate(pt), 120); } },
  savenote(v){ const t = S.topics.find(x=>x.id===+v); t.notes = $("#nt").value.trim(); if (!t.revs) t.pct = +$("#rg").value; save(); closeModal(); render(); },
  resettopic(v){ const id = +v; ask("Reset this topic?","Reset",()=>{ const t = S.topics.find(x=>x.id===id); t.pct=0;t.revs=0;t.last=null; S.log = S.log.filter(e=>e.id!==id); save(); closeModal(); render(); }); },
  deltopic(v){ const id = +v; ask("Delete this topic?","Delete",()=>{ S.topics = S.topics.filter(x=>x.id!==id); S.log = S.log.filter(e=>e.id!==id); if (S.pick&&S.pick.id===id) S.pick=null; save(); closeModal(); wheelSlices = []; render(); }); },
  askyes(){ const cb = askCb; askCb = null; if (cb) cb(); },
  flt(v){ flt = v; render(); },
  add(){ openAdd(); },
  doadd(){ const t = $("#at").value.trim(), u = $("#au").value.trim()||"General", sid = +$("#as").value; if (!t) return;
    S.topics.push({id:nextId(),sid,unit:u,title:t,pct:0,revs:0,notes:"",last:null,rel:[]}); save(); closeModal(); wheelSlices = []; render(); toast("Topic added"); },
  "subj-new"(){ openSubject(null); },
  "subj-edit"(v){ openSubject(+v); },
  pickc(v){ editColor = v; document.querySelectorAll("#sws .sw").forEach(b => b.classList.toggle("on", b.dataset.v===v)); },
  subjsave(){ const name = $("#sn").value.trim(); if (!name) { toast("Give it a name"); return; }
    if (editSid===null) { const s = newSubject(name); s.color = editColor; s.examDate = $("#sx").value; S.view = s.id; }
    else { const s = subj(editSid); s.name = name; s.color = editColor; s.examDate = $("#sx").value; }
    save(); closeModal(); wheelSlices = []; render(); },
  subjdel(v){ const id = +v; ask("Delete this subject and all its topics?","Delete",()=>{ const ids = new Set(S.topics.filter(t=>t.sid===id).map(t=>t.id));
    S.topics = S.topics.filter(t=>t.sid!==id); S.log = S.log.filter(e=>!ids.has(e.id)); S.subjects = S.subjects.filter(s=>s.id!==id);
    if (S.pick && ids.has(S.pick.id)) S.pick = null; if (S.view===id) S.view = "all"; save(); closeModal(); wheelSlices = []; render(); }); },
  theme(v){ S.theme = v; save(); render(true); },
  mode(v){ S.mode = v; save(); render(true); },
  look(v){ const [g,k] = v.split(":"); S[g] = k; save(); render(true); toast("Equipped"); },
  buy(v){ buy(v); },
  anim(v){ S.anim = v==="1"; save(); render(true); },
  accent(v){ S.accent = v; save(); render(true); },
  dynicon(v,el){ S.dynIcon = el.checked; lastIcon = null; save(); render(true); toast(S.dynIcon?"Icon will follow your theme":"Icon reset"); },
  mpreset(v){ S.eq = {}; if (v!=="Default") MPRESETS[v].v.forEach(id => { const [c,i] = id.split(":"); (S.eq[c] = S.eq[c]||[]).push(+i); }); save(); render(true); toast(v==="Default"?"Motion reset":v+" applied"); },
  equip(v){ equipItem(v); save(); render(true); },
  preview(v){ openPreview(v); },
  replay(v){ const [g,k] = v.split(":"), c = M.byId(g); M.demoPlay(c, $("#pvstage"), +k); },
  "cp-in"(){ copyText(PROMPT_IN); },
  "cp-out"(){ copyText(progressText()); },
  import(){ doImport(); },
  updcheck(){ updCheck(true); },
  updnow(){ const i = updPending(); if (!i || UPD.busy) return; UPD.busy = true; UPD.pct = 0; UPD.msg = "Starting…"; try { Android.updateInstall(i.url, i.sha, String(i.size||0)); } catch(e){ UPD.busy = false; UPD.msg = "Update failed."; } render(true); },
  upddismiss(){ const i = updPending(); if (i) updSet("spinwise.upd.d", i.versionCode); render(true); },
  updauto(v,el){ S.autoUpdate = el.checked; save(); },
  wipe(){ ask("Delete all your data?","Delete everything",() => { try { localStorage.removeItem(KEY); localStorage.removeItem("spinwise.v1"); localStorage.removeItem(SYNCKEY); } catch(e){} try { Android.wipe(); } catch(e){} SY.meta = { device:SY.meta.device }; S = norm({topics:[]}); wheelSlices = []; closeModal(); tab = "today"; render(false,true); toast("All data deleted"); }, "This erases every subject, topic, record, ✦ and unlock on this device. It can't be undone."); },
  sharepick(){ openSharePicker(); },
  sharesub(v){ closeModal(); shareChecklist(+v); },
  shareprog(){ shareProgress(); },
  syncnew(){ try { Android.pickSyncFile(true); } catch(e){ toast("Sync needs the Android app"); } },
  syncjoin(){ try { Android.pickSyncFile(false); } catch(e){ toast("Sync needs the Android app"); } },
  syncnow(){ pullSync(false); pushSync(); toast("Synced"); render(true); },
  syncoff(){ try { Android.syncUnlink(); } catch(e){} SY.meta.linked = false; saveMeta(); render(true); toast("Sync stopped"); },
  usecloud(){ if (SY.remote) adoptRemote(SY.remote); },
  keeplocal(){ S.updated = Date.now(); if (SY.remote) SY.meta.lastRemote = SY.remote.updated; persistLocal(); pushSync(); closeModal(); toast("Kept this device"); },
  importgo(){ importGo(); },
  bulk(){ openBulk(); },
  bulkgo(){ bulkGo(); },
  sample(){ try { const res = applyImport({ specs:[SAMPLE] }, false, ""); save(); tab = "today"; render(false,true); toast("Sample course added. Remove it any time in More › Subjects"); } catch(e){ toast(e.message); } },
  goal(v){ S.goal = Math.max(1,Math.min(10,S.goal+(+v))); save(); $("#gv").textContent = S.goal; },
  backup(){ copyText(JSON.stringify(Object.assign({},S,{version:3}))); },
  resetp(){ ask("Reset all progress?","Reset",()=>{ S.topics.forEach(t=>{t.pct=0;t.revs=0;t.last=null}); S.log=[]; S.pick=null; S.ms={}; save(); closeModal(); tab="today"; wheelSlices = []; render(false,true); }); }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (!el) return; const f = act[el.dataset.a]; if (f) f(el.dataset.v, el); });
/* tap feedback on every button (uses the equipped Button-press effects) */
document.addEventListener("pointerdown", e => {
  lastPt = { x:e.clientX, y:e.clientY };
  const b = e.target.closest("button"); if (!b || b.disabled || RM() || b.closest("nav") || b.classList.contains("sw")) return;
  playCat("btn", { el:b, pt:lastPt });
}, true);
window.addEventListener("resize", () => tab==="today" && drawWheel());

/* ================= native bridge (widget) ================= */
function pushNative(){
  try { if (!window.Android || !Android.sync) return;
    const c = counts(), days = {}, d = new Date();
    for (let i=0;i<40;i++){ const k = ymd(d); if (c[k]) days[k] = c[k]; d.setDate(d.getDate()-1); }
    const p = todayPick();
    Android.sync(JSON.stringify({ subject:title(), pct:overall(), goal:S.goal, days, total:vis().length,
      pick: p ? { title:p.title, date:today(), logged:loggedToday(p.id) } : null }));
  } catch(e){}
}
render(false,true); pushNative(); setTimeout(() => pullSync(true), 400); setTimeout(autoCheck, 1800);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (tab==="today" && !spinning) drawWheel(); });
</script>
</body>
