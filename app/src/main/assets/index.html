<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Spinwise</title>
<style>
/* Fonts (Fontshare FFL / OFL): Plus Jakarta Sans = body, Clash Display = headings & numbers, Chillax = buttons & labels */
@font-face{font-family:"Jakarta";src:url("fonts/PlusJakartaSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Clash";src:url("fonts/ClashDisplay-Semibold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Chillax";src:url("fonts/Chillax-Semibold.woff2") format("woff2");font-weight:600;font-display:swap}
:root{
  --font:"Jakarta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Clash","Jakarta",system-ui,sans-serif;
  --ui:"Chillax","Jakarta",system-ui,sans-serif;
  --bg:#f4f6f3; --card:#ffffff; --ink:#12161a; --mute:#677078; --line:#e2e6e1;
  --acc:#1f8a4c; --acc2:#0f6b3a; --acc-ink:#ffffff; --acc-soft:#e3f2e9; --warn:#d98a1f;
  --l0:#e7ebe6; --l1:#bde5cb; --l2:#74c794; --l3:#2f9e5b; --l4:#16673a;
  --w1:#ffffff; --w2:#edf1ec; --shadow:0 1px 2px rgba(20,30,20,.05),0 6px 20px rgba(20,30,20,.05);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0d1012; --card:#161a1d; --ink:#edf1f2; --mute:#8a949b; --line:#252b2f;
    --acc:#3fb96f; --acc2:#1f8a4c; --acc-ink:#06130b; --acc-soft:#13271b; --warn:#e7a23a;
    --l0:#1e2327; --l1:#173a26; --l2:#1f6a3f; --l3:#2e9a5b; --l4:#55d68a;
    --w1:#1b2024; --w2:#242a2f; --shadow:none;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{padding:16px 16px 4px;display:flex;gap:12px;align-items:center;max-width:640px;margin:0 auto}
header svg{width:42px;height:42px;flex:none;border-radius:12px;box-shadow:var(--shadow)}
h1{font-size:21px;margin:0;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--mute);font-size:13px}
main{padding:6px 16px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#fff;border:0;display:flex;gap:16px;align-items:center}
.hero .sub{color:rgba(255,255,255,.78)}
.hero b.big{font-size:26px;letter-spacing:-.02em;display:block;line-height:1.1}
.ringwrap{position:relative;flex:none}
.ringwrap .lab{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:20px;letter-spacing:-.02em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:rgba(255,255,255,.18);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--mute)}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--acc);color:var(--acc-ink);font-weight:650;cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.link{background:none;color:var(--mute);padding:8px;font-weight:550;font-size:13px}
button.small{padding:8px 12px;font-size:13px}
button:disabled{opacity:.45}
button.full{width:100%}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:11px 0 9px;font-size:11.5px;font-weight:650}
nav button.on{color:var(--acc)}
nav svg{display:block;margin:0 auto 3px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.wheelwrap{position:relative;width:min(100%,310px);margin:2px auto 14px;aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.ptr{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--ink);filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));z-index:2}
.topic{border-left:3px solid var(--acc);padding:4px 0 4px 12px;margin:2px 0 14px}
.topic small{color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.topic div{font-size:19px;font-weight:700;letter-spacing:-.01em;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--l0);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.warn i{background:var(--warn)}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;margin-top:12px}
.filters{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.filters button{padding:7px 12px;font-size:13px;background:var(--card);color:var(--mute);border:1px solid var(--line);white-space:nowrap}
.filters button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.unit{margin-top:12px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.unit>summary{list-style:none;padding:14px 16px;cursor:pointer}
.unit>summary::-webkit-details-marker{display:none}
.unit>summary .row b{font-weight:700}
.unit>summary em{font-style:normal;color:var(--mute);font-size:13px}
.unit>summary .bar{margin-top:9px;height:6px}
.item{display:flex;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer}
.badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:13px;flex:none;background:var(--l0);color:var(--ink)}
.badge[data-l="1"]{background:var(--l1)}.badge[data-l="2"]{background:var(--l2)}
.badge[data-l="3"]{background:var(--l3);color:#fff}.badge[data-l="4"]{background:var(--l4);color:#fff}
.item .t{font-weight:600;line-height:1.25}
.item .m{font-size:12px;color:var(--mute)}
.heat{overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;width:max-content}
.cell{width:13px;height:13px;border-radius:3px;background:var(--l0)}
.cell[data-l="1"]{background:var(--l1)}.cell[data-l="2"]{background:var(--l2)}
.cell[data-l="3"]{background:var(--l3)}.cell[data-l="4"]{background:var(--l4)}
.cell.future{visibility:hidden}.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.months{display:grid;grid-auto-flow:column;grid-auto-columns:16px;font-size:11px;color:var(--mute);height:16px;width:max-content}
.legend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--mute);justify-content:flex-end;margin-top:8px}
.legend .cell{width:11px;height:11px}
.tip{min-height:20px;font-size:13px;color:var(--mute);margin-top:8px}
textarea,input[type=text],input[type=date]{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:11px 12px}
textarea{min-height:130px;resize:vertical;font:13px/1.4 ui-monospace,Consolas,monospace}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,Consolas,monospace;margin:8px 0;max-height:190px;overflow:auto}
h2{font-size:16px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:18px 0 8px}
p{margin:4px 0 10px;color:var(--mute);font-size:13px}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}
.empty svg{width:64px;height:64px;margin-bottom:10px}
details.how>summary{cursor:pointer;color:var(--acc);font-weight:600;font-size:13px;margin:4px 0}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:9px 0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;padding:0;border-radius:10px}
label.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin:10px 0 2px}
.list-row{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.list-row:first-of-type{border-top:0}
.list-row .t{flex:1;font-weight:600;line-height:1.25}
.list-row .bar{width:70px;flex:none;height:6px}
.list-row .n{width:36px;text-align:right;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s}
.sheet .grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 14px}
.big-pct{font-size:44px;font-weight:750;letter-spacing:-.03em;line-height:1}
input[type=range]{width:100%;accent-color:var(--acc);margin:12px 0 6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.pills button{padding:7px 11px;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:.6}}
body{font-weight:400;font-synthesis:none}
h1,h2,h3,.hero b.big,.big-pct,.stat b,.topic div,.ringwrap .lab,.badge,.chip{font-family:var(--display);font-weight:600}
b,strong,button,.item .t,.list-row .t,.toast,details.how>summary,.unit>summary .row b{font-family:var(--ui);font-weight:600}
input,.search{font-family:var(--font)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;font-weight:600;z-index:30;animation:fade .15s}
</style>
</head>
<body>
<header>
  <div id="logo"></div>
  <div><h1 id="title">Spinwise</h1><div class="sub" id="subtitle"></div></div>
</header>
<main id="main"></main>
<nav id="nav"></nav>

<script>
/* ================= data ================= */
const KEY = "spinwise.v2";
const $ = s => document.querySelector(s);
const z2 = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+z2(d.getMonth()+1)+"-"+z2(d.getDate());
const today = () => ymd(new Date());
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let S = load(), tab = "today", spinning = false, rot = 0, wheelSlices = [];
let flt = "all", selDay = null; const openUnits = new Set();

function norm(s){
  s.goal = s.goal||1; s.examDate = s.examDate||""; s.log = s.log||[]; s.pick = s.pick||null; s.subject = s.subject||"";
  s.topics.forEach(t => { t.pct = t.pct||0; t.revs = t.revs||0; t.notes = t.notes||""; t.last = t.last||null; });
  return s;
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.topics) return norm(s); } catch(e){}
  try { // migrate v1
    const o = JSON.parse(localStorage.getItem("spinwise.v1")); if (o && o.topics) {
      const log = [];
      const topics = o.topics.map(t => { if (t.doneOn) log.push({d:t.doneOn,id:t.id,prev:{pct:0,revs:0,last:null}});
        return {id:t.id,unit:t.unit,title:t.title,pct:t.doneOn?60:0,revs:t.doneOn?1:0,last:t.doneOn||null,notes:""}; });
      return norm({subject:o.subject,topics,log,pick:o.pick});
    }
  } catch(e){}
  return norm({topics:[]});
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} pushNative(); }

/* ================= derived ================= */
const counts = () => { const m = {}; S.log.forEach(e => m[e.d] = (m[e.d]||0)+1); return m; };
const overall = () => S.topics.length ? Math.round(S.topics.reduce((a,t)=>a+t.pct,0)/S.topics.length) : 0;
const unitPct = items => items.length ? Math.round(items.reduce((a,t)=>a+t.pct,0)/items.length) : 0;
const level = p => p<=0?0:p<35?1:p<60?2:p<85?3:4;
function streaks(m){
  let cur = 0, d = new Date();
  if (!m[ymd(d)]) d.setDate(d.getDate()-1);
  while (m[ymd(d)]) { cur++; d.setDate(d.getDate()-1); }
  let best = 0, run = 0, prev = null;
  Object.keys(m).sort().forEach(k => { const dt = new Date(k+"T00:00:00");
    run = prev && Math.round((dt-prev)/864e5)===1 ? run+1 : 1; best = Math.max(best,run); prev = dt; });
  return { cur, best };
}
function ago(d){
  if (!d) return "not started";
  const n = Math.round((new Date(today()+"T00:00:00") - new Date(d+"T00:00:00"))/864e5);
  return n<=0 ? "today" : n===1 ? "yesterday" : n+"d ago";
}
const examDays = () => S.examDate ? Math.ceil((new Date(S.examDate+"T00:00:00") - new Date(today()+"T00:00:00"))/864e5) : null;
const todayPick = () => S.pick && S.pick.date===today() ? S.topics.find(t=>t.id===S.pick.id) : null;
const loggedToday = id => S.log.some(e => e.d===today() && e.id===id);
const todayCount = () => S.log.filter(e => e.d===today()).length;

/* ================= logo / icons ================= */
const LOGO = `<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fae65"/><stop offset="1" stop-color="#0f6b3a"/></linearGradient></defs>
<rect width="108" height="108" rx="26" fill="url(#g)"/>
<path d="M54,58L54,28A30,30 0 0 1 84,58Z" fill="#fff"/><path d="M54,58L84,58A30,30 0 0 1 54,88Z" fill="#bde5cb"/>
<path d="M54,58L54,88A30,30 0 0 1 24,58Z" fill="#fff"/><path d="M54,58L24,58A30,30 0 0 1 54,28Z" fill="#bde5cb"/>
<circle cx="54" cy="58" r="7" fill="#0f6b3a"/><path d="M54,17L46.5,29.5L61.5,29.5Z" fill="#fff"/></svg>`;
const ICON = {
  today:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 3v9l6 3"/></svg>',
  list:'<svg viewBox="0 0 24 24"><path d="M9 6h12M9 12h12M9 18h12M4 6l1 1 2-2M4 12l1 1 2-2M4 18l1 1 2-2"/></svg>',
  prog:'<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
  sync:'<svg viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8zM19 16l.9 2.1L22 19l-2.1.9L19 22l-.9-2.1L16 19l2.1-.9z"/></svg>'
};
function ring(p,size,stroke,track,col){
  const r=(size-stroke)/2, c=2*Math.PI*r;
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
  <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${col}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c*(1-p/100)}" transform="rotate(-90 ${size/2} ${size/2})"/></svg>`;
}

/* ================= helpers: toast / confirm / copy ================= */
function toast(t){ const e = document.createElement("div"); e.className="toast"; e.textContent=t; document.body.appendChild(e); setTimeout(()=>e.remove(),2200); }
function modal(html){ closeModal(); const s = document.createElement("div"); s.className="scrim"; s.id="scrim";
  s.innerHTML = `<div class="sheet"><div class="grab"></div>${html}</div>`;
  s.addEventListener("click", e => { if (e.target===s) closeModal(); }); document.body.appendChild(s); }
function closeModal(){ const s = $("#scrim"); if (s) s.remove(); }
let askCb = null;
function ask(msg, yes, cb){ askCb = cb; modal(`<h2>${esc(msg)}</h2><p>This can't be undone.</p><div class="row"><button class="ghost sp" data-a="close">Cancel</button><button class="sp" data-a="askyes">${esc(yes)}</button></div>`); }
function copyText(text){
  let ok = false;
  try { if (window.Android && Android.copy) { Android.copy(text); ok = true; } } catch(e){}
  if (!ok) { const ta = document.createElement("textarea"); ta.value = text; ta.style.cssText="position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
    try { ok = document.execCommand("copy"); } catch(e){} ta.remove(); }
  if (!ok) try { navigator.clipboard.writeText(text); ok = true; } catch(e){}
  toast(ok ? "Copied to clipboard" : "Couldn't copy"); return ok;
}

/* ================= Claude sync text ================= */
const FORMAT = `{"subject":"<course name>","examDate":"<YYYY-MM-DD or empty>","units":[{"name":"<unit>","topics":[{"title":"<topic>","pct":0,"notes":"<optional short note>"}]}]}`;
const PROMPT_IN = `Set up my Spinwise revision app.

You already know my education from our conversations and memory (my courses, exam boards, specification, target grades, weak areas, anything I've told you). Use that. Do NOT ask me to paste the spec unless you genuinely don't have it. If I take several subjects, ask which one to build first (one subject per checklist).

Build the checklist:
- Units = the main spec sections. Topics = small, individually revisable chunks (20-60 min each), using the exam board's own wording.
- "pct" = how well you think I currently know that topic (0-100), based on what I've told you or shown you. Use 0 if unknown.
- "notes" = optional one-line reminder (key formula, common mistake, past feedback).
- "examDate" if you know it.

Reply with ONLY valid JSON in exactly this shape, nothing else:
${FORMAT}`;

function progressText(){
  const m = counts(), st = streaks(m), ed = examDays();
  const units = []; S.topics.forEach(t => { let u = units.find(x=>x.name===t.unit); if (!u) { u={name:t.unit,items:[]}; units.push(u); } u.items.push(t); });
  const weak = S.topics.slice().sort((a,b)=>a.pct-b.pct).slice(0,6);
  const week = S.log.filter(e => (new Date(today()+"T00:00:00") - new Date(e.d+"T00:00:00"))/864e5 < 7).length;
  const snap = { subject:S.subject, examDate:S.examDate, units: units.map(u => ({name:u.name, topics:u.items.map(t=>({title:t.title,pct:t.pct,revisions:t.revs,last:t.last}))})) };
  return `Here is my latest Spinwise progress (${today()}). Please acknowledge it, tell me what to focus on this week, and keep it in mind for next time. If you want to change my checklist, reply with JSON in the same shape as before and I'll import it.

Subject: ${S.subject||"(unnamed)"}
Overall revised: ${overall()}%  |  Topics started: ${S.topics.filter(t=>t.revs).length}/${S.topics.length}
Streak: ${st.cur} days (best ${st.best})  |  Revisions in the last 7 days: ${week}
${ed!==null?`Exam: ${S.examDate} (${ed} days away)\n`:""}Units: ${units.map(u=>`${u.name} ${unitPct(u.items)}%`).join(", ")}
Weakest topics: ${weak.map(t=>`${t.title} (${t.pct}%)`).join("; ")}

Full data:
${JSON.stringify(snap)}`;
}

/* ================= import ================= */
function parseSpec(text){
  text = text.trim(); if (!text) throw new Error("Nothing pasted.");
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a>=0 && b>a) { try {
    const j = JSON.parse(text.slice(a,b+1));
    if (j.version===2 && Array.isArray(j.topics)) return { backup:j };
    if (Array.isArray(j.units)) {
      const topics = [];
      j.units.forEach(u => (u.topics||[]).forEach(t => { const o = typeof t==="string" ? {title:t} : t;
        topics.push({ unit:String(u.name||"General"), title:String(o.title||o.name||"").trim(), pct:Math.max(0,Math.min(100,+o.pct||0)), notes:String(o.notes||"") }); }));
      return { subject:String(j.subject||""), examDate:/^\d{4}-\d\d-\d\d$/.test(j.examDate||"")?j.examDate:"", topics };
    }
  } catch(e){} }
  let unit = "General", subject = "", topics = [], first = true;
  text.split(/\r?\n/).forEach(line => { const l = line.trim(); if (!l) return;
    const h = l.match(/^#{1,3}\s+(.*)/);
    if (h) { if (first && /^#\s/.test(l)) { subject = h[1]; first = false; } else unit = h[1]; return; }
    const li = l.match(/^(?:[-*•]|\d+[.)])\s+(.*)/);
    if (li) topics.push({ unit, title:li[1].trim(), pct:0, notes:"" }); else if (/:$/.test(l)) unit = l.slice(0,-1); });
  if (!topics.length) throw new Error("Couldn't find any topics. Ask Claude for the JSON format.");
  return { subject, examDate:"", topics };
}
function doImport(){

    const replace = $("#replace") && $("#replace").checked;
    const clean = r.topics.filter(t => t.title);
    if (!clean.length) throw new Error("No topics found.");
    if (!S.topics.length || replace) {
      S = norm({ subject:r.subject||S.subject||"My course", examDate:r.examDate, topics:clean.map((t,i)=>({id:i,unit:t.unit,title:t.title,pct:t.pct,revs:0,notes:t.notes,last:null})), log:[], pick:null });
      toast(`Imported ${clean.length} topics`);
    } else {
      let add = 0, upd = 0, nid = Math.max(...S.topics.map(t=>t.id))+1;
      clean.forEach(t => { const ex = S.topics.find(x => x.title.toLowerCase()===t.title.toLowerCase());
        if (ex) { upd++; ex.unit = t.unit; if (t.notes && !ex.notes) ex.notes = t.notes; if (!ex.revs && t.pct) ex.pct = t.pct; }
        else { add++; S.topics.push({id:nid++,unit:t.unit,title:t.title,pct:t.pct,revs:0,notes:t.notes,last:null}); } });
      if (r.subject && !S.subject) S.subject = r.subject; if (r.examDate) S.examDate = r.examDate;

}

function logRevision(id,pct,notes){
  const t = S.topics.find(x=>x.id===id); if (!t) return;
  S.log.push({ d:today(), id, prev:{pct:t.pct,revs:t.revs,last:t.last} });
  t.pct = pct; t.revs++; t.last = today(); if (notes!==undefined) t.notes = notes;
  save();
}
function undoRevision(id){
  for (let i=S.log.length-1;i>=0;i--) if (S.log[i].id===id && S.log[i].d===today()) {
    const e = S.log[i], t = S.topics.find(x=>x.id===id); if (t && e.prev) { t.pct=e.prev.pct; t.revs=e.prev.revs; t.last=e.prev.last; }
    S.log.splice(i,1); save(); return true; }
  return false;
}

/* ================= wheel ================= */
function drawWheel(){
  const cv = $("#wheel"); if (!cv) return;
  const size = cv.clientWidth, dpr = window.devicePixelRatio||1; cv.width = size*dpr; cv.height = size*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const cs = getComputedStyle(document.documentElement), g = k => cs.getPropertyValue(k).trim();
  const ink = g("--ink"), acc = g("--acc"), line = g("--line"), cols = [g("--w1"),g("--w2")];
  const R = size/2-5, n = wheelSlices.length||1, a = Math.PI*2/n;
  ctx.clearRect(0,0,size,size);
  ctx.beginPath(); ctx.arc(size/2,size/2,R+3,0,7); ctx.fillStyle = g("--card"); ctx.fill(); ctx.strokeStyle = line; ctx.stroke();
  ctx.save(); ctx.translate(size/2,size/2); ctx.rotate(rot);
  for (let i=0;i<n;i++){
    const hi = n>1 && i===n-1 && n%2;
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a); ctx.closePath();
    ctx.fillStyle = hi ? acc : cols[i%2]; ctx.fill(); ctx.strokeStyle = line; ctx.lineWidth = 1; ctx.stroke();
    ctx.save(); ctx.rotate(-Math.PI/2+(i+.5)*a); ctx.textAlign="right"; ctx.textBaseline="middle";
    ctx.fillStyle = hi ? "#fff" : ink; ctx.font = '600 11px Chillax, Jakarta, sans-serif';
    let t = (wheelSlices[i]||{}).title||""; const max = Math.floor(R*0.62/6.2); if (t.length>max) t = t.slice(0,max-1)+"…";
    ctx.fillText(t, R-12, 0); ctx.restore();
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(size/2,size/2,17,0,7); ctx.fillStyle = g("--card"); ctx.fill(); ctx.strokeStyle = line; ctx.stroke();
  ctx.beginPath(); ctx.arc(size/2,size/2,5,0,7); ctx.fillStyle = acc; ctx.fill();
}
function pool(){ const p = S.topics.filter(t=>t.pct<100); return p.length ? p : S.topics; }
function weightedWinner(){
  const p = pool(), w = p.map(t => ((100-t.pct)+8) * (t.last===today() ? .15 : 1));
  let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for (let i=0;i<p.length;i++){ r -= w[i]; if (r<=0) return p[i]; } return p[p.length-1];
}
function buildSlices(winner){
  const others = pool().filter(t => !winner || t.id!==winner.id).sort(()=>Math.random()-.5).slice(0,7);
  if (winner) others.push(winner); return others.sort(()=>Math.random()-.5);
}
function spin(){
  if (spinning || !S.topics.length) return;
  const winner = weightedWinner(); wheelSlices = buildSlices(winner);
  const idx = wheelSlices.findIndex(t=>t.id===winner.id), a = Math.PI*2/wheelSlices.length;
  const start = rot % (Math.PI*2), target = Math.PI*2*6 - (idx+.5)*a, t0 = performance.now(), dur = 4200;
  spinning = true; $("#spinbtn").disabled = true;
  (function step(now){
    const p = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-p,4); rot = start+(target-start)*e; drawWheel();
    if (p<1) requestAnimationFrame(step); else { spinning = false; S.pick = {date:today(),id:winner.id}; save(); render(true); }
  })(t0);
}

  } catch(e){}
}
render(); pushNative();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (tab==="today" && !spinning) drawWheel(); });
</script>
