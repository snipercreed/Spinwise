<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Spinwise</title>
<style>
/* Fonts (Fontshare FFL / OFL): Plus Jakarta Sans = body, Clash Display = headings & numbers, Chillax = buttons & labels */
@font-face{font-family:"Jakarta";src:url("fonts/PlusJakartaSans-Regular.woff2") format("woff2");font-weight:400;font-display:swap}
@font-face{font-family:"Clash";src:url("fonts/ClashDisplay-Semibold.woff2") format("woff2");font-weight:600;font-display:swap}
@font-face{font-family:"Chillax";src:url("fonts/Chillax-Semibold.woff2") format("woff2");font-weight:600;font-display:swap}
:root{
  --font:"Jakarta",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --display:"Clash","Jakarta",system-ui,sans-serif;
  --ui:"Chillax","Jakarta",system-ui,sans-serif;
  --bg:#f4f6f3; --card:#ffffff; --ink:#12161a; --mute:#677078; --line:#e2e6e1;
  --acc:#1f8a4c; --acc2:#0f6b3a; --acc-ink:#ffffff; --warn:#d98a1f; --hero1:#1f8a4c; --hero2:#0f6b3a;
  --l0:#e7ebe6; --l1:#bde5cb; --l2:#74c794; --l3:#2f9e5b; --l4:#16673a;
  --shadow:0 1px 2px rgba(20,30,20,.05),0 6px 20px rgba(20,30,20,.05);
}
:root[data-mode="dark"]{
  --bg:#0d1012; --card:#161a1d; --ink:#edf1f2; --mute:#8a949b; --line:#252b2f; --warn:#e7a23a;
  --l0:#1e2327; --shadow:none;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 var(--font)}
body{min-height:100vh;padding:env(safe-area-inset-top) 0 calc(76px + env(safe-area-inset-bottom))}
header{padding:16px 16px 4px;display:flex;gap:12px;align-items:center;max-width:640px;margin:0 auto}
header svg{width:42px;height:42px;flex:none;border-radius:12px;box-shadow:var(--shadow)}
h1{font-size:21px;margin:0;letter-spacing:-.02em;line-height:1.15}
.sub{color:var(--mute);font-size:13px}
main{padding:6px 16px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px;box-shadow:var(--shadow)}
.hero{background:linear-gradient(135deg,var(--hero1),var(--hero2));color:#fff;border:0;display:flex;gap:16px;align-items:center}
.hero .sub{color:rgba(255,255,255,.8)}
.hero b.big{font-size:26px;letter-spacing:-.02em;display:block;line-height:1.1}
.ringwrap{position:relative;flex:none}
.ringwrap .lab{position:absolute;inset:0;display:grid;place-items:center;font-size:20px;letter-spacing:-.02em}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chip{background:rgba(255,255,255,.2);border-radius:99px;padding:3px 10px;font-size:12px}
.row{display:flex;gap:10px;align-items:center}
.sp{flex:1}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font-size:22px;letter-spacing:-.02em}
.stat span{font-size:12px;color:var(--mute)}
button{font:inherit;border:0;border-radius:12px;padding:13px 16px;background:var(--acc);color:var(--acc-ink);cursor:pointer}
button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
button.link{background:none;color:var(--mute);padding:8px;font-size:13px}
button.small{padding:8px 12px;font-size:13px}
button:disabled{opacity:.45}
button.full{width:100%}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:none;color:var(--mute);border-radius:0;padding:11px 0 9px;font-size:11px}
nav button.on{color:var(--acc)}
nav svg{display:block;margin:0 auto 3px;width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.subj{display:flex;gap:6px;margin-top:12px;overflow-x:auto;padding-bottom:2px}
.sc{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:99px;background:var(--card);color:var(--ink);border:1px solid var(--line);white-space:nowrap;font-size:13px}
.sc.on{box-shadow:inset 0 0 0 2px var(--c);border-color:var(--c)}
.dot{width:10px;height:10px;border-radius:99px;background:var(--c);display:inline-block;flex:none}
.wheelwrap{position:relative;width:min(100%,310px);margin:2px auto 14px;aspect-ratio:1}
canvas{width:100%;height:100%;display:block}
.ptr{position:absolute;top:-7px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:11px solid transparent;border-right:11px solid transparent;border-top:20px solid var(--ink);filter:drop-shadow(0 1px 1px rgba(0,0,0,.3));z-index:2}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:12px}
.seg button{flex:1;border-radius:0;background:transparent;color:var(--mute);padding:9px 6px;font-size:13px}
.seg button.on{background:var(--acc);color:var(--acc-ink)}
.topic{border-left:3px solid var(--c,var(--acc));padding:4px 0 4px 12px;margin:2px 0 14px}
.topic small{color:var(--mute);text-transform:uppercase;letter-spacing:.06em;font-size:11px}
.topic div{font-size:19px;letter-spacing:-.01em;margin-top:2px}
.bar{height:8px;border-radius:99px;background:var(--l0);overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px}
.bar.warn i{background:var(--warn)}
.search{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:11px 14px;font:inherit;margin-top:12px}
.filters{display:flex;gap:6px;margin-top:10px;overflow-x:auto}
.filters button{padding:7px 12px;font-size:13px;background:var(--card);color:var(--mute);border:1px solid var(--line);white-space:nowrap}
.filters button.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.unit{margin-top:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--sc,var(--line));border-radius:18px;overflow:hidden;box-shadow:var(--shadow)}
.unit>summary{list-style:none;padding:14px 16px;cursor:pointer}
.unit>summary::-webkit-details-marker{display:none}
.unit>summary em{font-style:normal;color:var(--mute);font-size:13px}
.unit>summary .bar{margin-top:9px;height:6px}
.unit .tag{font-size:11px;color:var(--mute)}
.item{display:flex;gap:12px;align-items:center;padding:11px 16px;border-top:1px solid var(--line);cursor:pointer}
.badge{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:13px;flex:none;background:var(--l0);color:var(--ink)}
.badge[data-l="1"]{background:var(--l1)}.badge[data-l="2"]{background:var(--l2)}
.badge[data-l="3"]{background:var(--l3);color:#fff}.badge[data-l="4"]{background:var(--l4);color:#fff}
.item .t{line-height:1.25}
.item .m{font-size:12px;color:var(--mute)}
.pill{display:inline-block;font-size:10.5px;padding:1px 7px;border-radius:99px;background:var(--l1);color:var(--ink);margin-left:6px;vertical-align:middle;font-family:var(--ui)}
.pill.due{background:var(--warn);color:#fff}
.heat{overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.grid{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,13px);gap:3px;width:max-content}
.cell{width:13px;height:13px;border-radius:3px;background:var(--l0)}
.cell[data-l="1"]{background:var(--l1)}.cell[data-l="2"]{background:var(--l2)}
.cell[data-l="3"]{background:var(--l3)}.cell[data-l="4"]{background:var(--l4)}
.cell.future{visibility:hidden}.cell.sel{outline:2px solid var(--ink);outline-offset:1px}
.months{display:grid;grid-auto-flow:column;grid-auto-columns:16px;font-size:11px;color:var(--mute);height:16px;width:max-content}
.legend{display:flex;gap:4px;align-items:center;font-size:11px;color:var(--mute);justify-content:flex-end;margin-top:8px}
.legend .cell{width:11px;height:11px}
.tip{min-height:20px;font-size:13px;color:var(--mute);margin-top:8px}
textarea,input[type=text],input[type=date],select{width:100%;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);font:inherit;font-size:14px;padding:11px 12px}
textarea{min-height:130px;resize:vertical;font:13px/1.4 ui-monospace,Consolas,monospace}
pre{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.4 ui-monospace,Consolas,monospace;margin:8px 0;max-height:190px;overflow:auto}
h2{font-size:16px;margin:0 0 4px;letter-spacing:-.01em}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--mute);margin:18px 0 8px}
p{margin:4px 0 10px;color:var(--mute);font-size:13px}
.msg{font-size:13px;margin-top:8px;min-height:18px}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}
.empty svg{width:64px;height:64px;margin-bottom:10px}
details.how>summary{cursor:pointer;color:var(--acc);font-size:13px;margin:4px 0}
.lbl{display:flex;justify-content:space-between;align-items:center;font-size:14px;padding:9px 0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:34px;height:34px;padding:0;border-radius:10px}
label.check{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mute);margin:10px 0 2px}
.list-row{display:flex;gap:12px;align-items:center;padding:9px 0;border-top:1px solid var(--line)}
.list-row:first-of-type{border-top:0}
.list-row .t{flex:1;line-height:1.25}
.list-row .bar{width:70px;flex:none;height:6px}
.list-row .n{width:36px;text-align:right;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.rec{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.rec:first-of-type{border-top:0}
.rec .t{flex:1;line-height:1.25}
.swatches{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0 14px}
.sw{width:38px;height:38px;border-radius:99px;padding:0;background:var(--c);border:0}
.sw.on{outline:3px solid var(--ink);outline-offset:2px}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:up .2s}
.sheet .grab{width:38px;height:4px;border-radius:9px;background:var(--line);margin:-6px auto 14px}
.big-pct{font-size:44px;letter-spacing:-.03em;line-height:1}
input[type=range]{width:100%;accent-color:var(--acc);margin:12px 0 6px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0 12px}
.pills button{padding:7px 11px;font-size:13px;background:var(--bg);color:var(--ink);border:1px solid var(--line)}
@keyframes fade{from{opacity:0}}@keyframes up{from{transform:translateY(30px);opacity:.6}}
body{font-weight:400;font-synthesis:none}
h1,h2,h3,.hero b.big,.big-pct,.stat b,.topic div,.ringwrap .lab,.badge,.chip{font-family:var(--display);font-weight:600}
b,strong,button,.item .t,.list-row .t,.rec .t,.toast,details.how>summary{font-family:var(--ui);font-weight:600}
input,select,.search{font-family:var(--font)}
.toast{position:fixed;left:50%;bottom:calc(86px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:13px;z-index:30;animation:fade .15s}
</style>
</head>
<body>
<header>
  <div id="logo"></div>
  <div><h1 id="title">Spinwise</h1><div class="sub" id="subtitle"></div></div>
</header>
<main id="main"></main>
<nav id="nav"></nav>

<script>
/* ================= data ================= */
const KEY = "spinwise.v2";
const $ = s => document.querySelector(s);
const z2 = n => String(n).padStart(2,"0");
const ymd = d => d.getFullYear()+"-"+z2(d.getMonth()+1)+"-"+z2(d.getDate());
const today = () => ymd(new Date());
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PAL = ["#e5484d","#f76b15","#e0a100","#30a46c","#12a594","#3e63dd","#8e4ec6","#d6409f","#6f7a83"];
let S = load(), tab = "today", spinning = false, rot = 0, wheelSlices = [];
let flt = "all", selDay = null, editSid = null, editColor = PAL[0]; const openUnits = new Set();

function norm(s){
  s.topics = s.topics||[]; s.goal = s.goal||1; s.log = s.log||[]; s.pick = s.pick||null;
  s.theme = s.theme||"forest"; s.mode = s.mode||"system"; s.wmode = s.wmode||"any"; s.view = s.view===undefined?"all":s.view;
  if (!s.subjects || !s.subjects.length) {
    s.subjects = (s.topics.length || s.subject) ? [{ id:0, name:s.subject||"My course", color:PAL[3], examDate:s.examDate||"" }] : [];
  }
  s.topics.forEach(t => { if (t.sid===undefined) t.sid = s.subjects.length ? s.subjects[0].id : 0;
    t.pct = t.pct||0; t.revs = t.revs||0; t.notes = t.notes||""; t.last = t.last||null; t.rel = t.rel||[]; });
  delete s.subject; delete s.examDate;
  if (s.view!=="all" && !s.subjects.some(x=>x.id===s.view)) s.view = "all";
  return s;
}
function load(){
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && s.topics) return norm(s); } catch(e){}
  try { const o = JSON.parse(localStorage.getItem("spinwise.v1")); if (o && o.topics) {
      const log = [];
      const topics = o.topics.map(t => { if (t.doneOn) log.push({d:t.doneOn,id:t.id,prev:{pct:0,revs:0,last:null}});
        return {id:t.id,unit:t.unit,title:t.title,pct:t.doneOn?60:0,revs:t.doneOn?1:0,last:t.doneOn||null,notes:""}; });
      return norm({subject:o.subject,topics,log,pick:o.pick}); } } catch(e){}
  return norm({topics:[]});
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} pushNative(); }

/* ================= derived ================= */
const subj = id => S.subjects.find(s=>s.id===id);
const colorOf = t => (subj(t.sid)||{color:"#6f7a83"}).color;
const vis = () => S.view==="all" ? S.topics : S.topics.filter(t=>t.sid===S.view);
const visSubjects = () => S.view==="all" ? S.subjects : S.subjects.filter(s=>s.id===S.view);
const counts = () => { const m = {}; S.log.forEach(e => m[e.d] = (m[e.d]||0)+1); return m; };
const avg = items => items.length ? Math.round(items.reduce((a,t)=>a+t.pct,0)/items.length) : 0;
const overall = () => avg(vis());
const level = p => p<=0?0:p<35?1:p<60?2:p<85?3:4;
const sinceDays = d => Math.round((new Date(today()+"T00:00:00") - new Date(d+"T00:00:00"))/864e5);
const dueInt = p => p<40?2:p<60?4:p<80?7:p<95?14:30;
const isDue = t => t.revs>0 && t.last && sinceDays(t.last) >= dueInt(t.pct);
function streaks(m){
  let cur = 0, d = new Date();
  if (!m[ymd(d)]) d.setDate(d.getDate()-1);
  while (m[ymd(d)]) { cur++; d.setDate(d.getDate()-1); }
  let best = 0, run = 0, prev = null;
  Object.keys(m).sort().forEach(k => { const dt = new Date(k+"T00:00:00");
    run = prev && Math.round((dt-prev)/864e5)===1 ? run+1 : 1; best = Math.max(best,run); prev = dt; });
  return { cur, best };
}
function ago(d){ if (!d) return "not started"; const n = sinceDays(d); return n<=0 ? "today" : n===1 ? "yesterday" : n+"d ago"; }
function nextExam(){
  let best = null;
  visSubjects().forEach(s => { if (!s.examDate) return;
    const d = Math.ceil((new Date(s.examDate+"T00:00:00") - new Date(today()+"T00:00:00"))/864e5);
    if (d>=0 && (!best || d<best.d)) best = { d, name:s.name }; });
  return best;
}
const todayPick = () => S.pick && S.pick.date===today() ? S.topics.find(t=>t.id===S.pick.id) : null;
const loggedToday = id => S.log.some(e => e.d===today() && e.id===id);
const todayCount = () => S.log.filter(e => e.d===today()).length;
function lastTopic(){ for (let i=S.log.length-1;i>=0;i--) { const t = S.topics.find(x=>x.id===S.log[i].id); if (t) return t; } return null; }

/* ================= relevance / recommendations ================= */
const STOP = new Set(["the","and","for","with","from","that","this","into","their","of","in","on","to","a","an","its","are","how","what","use","using","between","types","type","introduction","basic","basics","principles","structure","function"]);
const toks = s => new Set(String(s).toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(w=>w.length>3 && !STOP.has(w)));
function relScore(a,b){
  if (!a || a.id===b.id) return 0;
  let s = 0;
  const al = (a.rel||[]).map(x=>String(x).toLowerCase()), bl = (b.rel||[]).map(x=>String(x).toLowerCase());
  if (al.includes(b.title.toLowerCase())) s += 6;
  if (bl.includes(a.title.toLowerCase())) s += 6;
  if (a.sid===b.sid) { s += 1;
    if (a.unit===b.unit) { s += 3; const d = Math.abs(S.topics.indexOf(a)-S.topics.indexOf(b)); if (d===1) s += 2; else if (d===2) s += 1; } }
  const ta = toks(a.title), tb = toks(b.title); let k = 0; ta.forEach(w => { if (tb.has(w)) k++; }); s += Math.min(3,k);
  return s;
}
function recs(n){
  const last = lastTopic();
  return vis().filter(t => t.pct<100 && (!last || t.id!==last.id)).map(t => {
    const r = relScore(last,t), due = isDue(t), weak = (100-t.pct)/100;
    const sc = r*(0.6+weak) + (due?2:0) + (t.revs?0:.6) + weak*1.5 - (t.last===today()?3:0);
    return { t, sc, r, due };
  }).sort((a,b)=>b.sc-a.sc).slice(0,n);
}
const recTag = x => x.r>=3 ? "Related" : x.due ? "Due" : !x.t.revs ? "New" : "Weak";

/* ================= themes ================= */
const THEMES = {
  forest:{n:"Forest",l:["#1f8a4c","#0f6b3a"],d:["#3fb96f","#1f8a4c"]},
  ocean:{n:"Ocean",l:["#1d6fd1","#114b9a"],d:["#58a6ff","#1d6fd1"]},
  violet:{n:"Violet",l:["#7a48d8","#53289f"],d:["#a78bfa","#7a48d8"]},
  sunset:{n:"Sunset",l:["#e0662a","#b0431a"],d:["#ff9a5c","#e0662a"]},
  rose:{n:"Rose",l:["#d6336c","#a31d4c"],d:["#ff7ba5","#d6336c"]},
  slate:{n:"Slate",l:["#3f4a54","#1d252c"],d:["#aeb8c2","#6b7783"]}
};
const rgb = h => [1,3,5].map(i=>parseInt(h.substr(i,2),16));
const mix = (a,b,t) => { const A = rgb(a), B = rgb(b); return "#"+A.map((v,i)=>Math.round(v*t+B[i]*(1-t)).toString(16).padStart(2,"0")).join(""); };
const isDark = () => S.mode==="dark" || (S.mode!=="light" && window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches);
function applyTheme(){
  const dark = isDark(), th = THEMES[S.theme]||THEMES.forest, pair = dark?th.d:th.l, a = pair[0], a2 = pair[1];
  const bg = dark?"#161a1d":"#ffffff", st = document.documentElement.style;
  document.documentElement.dataset.mode = dark?"dark":"light";
  st.setProperty("--acc",a); st.setProperty("--acc2",a2); st.setProperty("--acc-ink",dark?"#071009":"#ffffff");
  st.setProperty("--hero1",th.l[0]); st.setProperty("--hero2",th.l[1]);
  st.setProperty("--l1",mix(a,bg,dark?.3:.32)); st.setProperty("--l2",mix(a,bg,dark?.55:.6)); st.setProperty("--l3",mix(a,bg,dark?.8:.88)); st.setProperty("--l4",dark?a:a2);
  try { if (window.Android && Android.setMode) Android.setMode(dark); } catch(e){}
}
if (window.matchMedia) matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (S.mode==="system") { applyTheme(); render(true); } });

/* ================= logo / icons ================= */
const LOGO = `<svg viewBox="0 0 108 108" xmlns="http://www.w3.org/2000/svg"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2fae65"/><stop offset="1" stop-color="#0f6b3a"/></linearGradient></defs>

function toSpec(j){
  const topics = [];
  (j.units||[]).forEach(u => (u.topics||[]).forEach(t => { const o = typeof t==="string" ? {title:t} : t;
    topics.push({ unit:String(u.name||"General"), title:String(o.title||o.name||"").trim(), pct:Math.max(0,Math.min(100,+(o.pct??0)||0)),
      notes:String(o.notes||""), rel:(Array.isArray(o.related)?o.related:[]).map(String) }); }));
  return { subject:String(j.subject||""), examDate:/^\d{4}-\d\d-\d\d$/.test(j.examDate||"")?j.examDate:"", topics };
}
function parseSpec(text){
  text = text.trim(); if (!text) throw new Error("Nothing pasted.");
  const a = text.indexOf("{"), b = text.lastIndexOf("}");
  if (a>=0 && b>a) { try {
    const j = JSON.parse(text.slice(a,b+1));
    if (j.version>=2 && Array.isArray(j.topics)) return { backup:j };
    if (Array.isArray(j.subjects)) return { specs: j.subjects.map(toSpec) };
    if (Array.isArray(j.units)) return { specs:[toSpec(j)] };
  } catch(e){} }
  let unit = "General", subject = "", topics = [], first = true;
  text.split(/\r?\n/).forEach(line => { const l = line.trim(); if (!l) return;
    const h = l.match(/^#{1,3}\s+(.*)/);
    if (h) { if (first && /^#\s/.test(l)) { subject = h[1]; first = false; } else unit = h[1]; return; }
    const li = l.match(/^(?:[-*•]|\d+[.)])\s+(.*)/);
    if (li) topics.push({ unit, title:li[1].trim(), pct:0, notes:"", rel:[] }); else if (/:$/.test(l)) unit = l.slice(0,-1); });
  if (!topics.length) throw new Error("Couldn't find any topics. Ask Claude for the JSON format.");
  return { specs:[{ subject, examDate:"", topics }] };
}

      items.forEach(t => {

        if (ex) { upd++; ex.unit = t.unit; if (t.notes && !ex.notes) ex.notes = t.notes; if (t.rel.length) ex.rel = t.rel; if (!ex.revs && t.pct) ex.pct = t.pct; }

/* ================= wheel ================= */
function drawWheel(){
  const cv = $("#wheel"); if (!cv) return;
  const size = cv.clientWidth, dpr = window.devicePixelRatio||1; cv.width = size*dpr; cv.height = size*dpr;
  const ctx = cv.getContext("2d"); ctx.scale(dpr,dpr);
  const cs = getComputedStyle(document.documentElement), g = k => cs.getPropertyValue(k).trim();
  const ink = g("--ink"), line = g("--line"), card = g("--card"), dark = document.documentElement.dataset.mode==="dark";
  const R = size/2-5, n = wheelSlices.length||1, a = Math.PI*2/n;
  ctx.clearRect(0,0,size,size);
  ctx.beginPath(); ctx.arc(size/2,size/2,R+3,0,7); ctx.fillStyle = card; ctx.fill(); ctx.strokeStyle = line; ctx.stroke();
  ctx.save(); ctx.translate(size/2,size/2); ctx.rotate(rot);
  for (let i=0;i<n;i++){
    const sl = wheelSlices[i]||{}, c = /^#[0-9a-f]{6}$/i.test(colorOf(sl)) ? colorOf(sl) : "#6f7a83";
    ctx.beginPath(); ctx.moveTo(0,0); ctx.arc(0,0,R,-Math.PI/2+i*a,-Math.PI/2+(i+1)*a); ctx.closePath();
    ctx.fillStyle = mix(c, dark?"#161a1d":"#ffffff", (dark?.3:.18) + (i%2)*.12); ctx.fill(); ctx.strokeStyle = card; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.rotate(-Math.PI/2+(i+.5)*a); ctx.textAlign="right"; ctx.textBaseline="middle";
    ctx.fillStyle = ink; ctx.font = '600 11px Chillax, Jakarta, sans-serif';
    let t = sl.title||""; const max = Math.floor(R*0.62/6.2); if (t.length>max) t = t.slice(0,max-1)+"…";
    ctx.fillText(t, R-12, 0); ctx.restore();
  }
  ctx.restore();
  ctx.beginPath(); ctx.arc(size/2,size/2,17,0,7); ctx.fillStyle = card; ctx.fill(); ctx.strokeStyle = line; ctx.stroke();
  ctx.beginPath(); ctx.arc(size/2,size/2,5,0,7); ctx.fillStyle = g("--acc"); ctx.fill();
}
function pool(){ const p = vis().filter(t=>t.pct<100); return p.length ? p : vis(); }
function weight(t, last){
  const w = ((100-t.pct)+8) * (t.last===today() ? .15 : 1) * (isDue(t) ? 1.8 : 1);
  return S.wmode==="related" && last ? w*(relScore(last,t)+.5) : w;
}
function weightedWinner(){
  const last = lastTopic(), p = pool().filter(t => !last || t.id!==last.id || pool().length===1), w = p.map(t => weight(t,last));
  let r = Math.random()*w.reduce((a,b)=>a+b,0);
  for (let i=0;i<p.length;i++){ r -= w[i]; if (r<=0) return p[i]; } return p[p.length-1];
}
function buildSlices(winner){
  const last = lastTopic();
  const others = pool().filter(t => !winner || t.id!==winner.id).map(t=>({t,k:Math.random()*weight(t,last)})).sort((a,b)=>b.k-a.k).slice(0,7).map(x=>x.t);
  if (winner) others.push(winner); return others.sort(()=>Math.random()-.5);
}
function spin(){
  if (spinning || !vis().length) return;
  const winner = weightedWinner(); wheelSlices = buildSlices(winner);
  const idx = wheelSlices.findIndex(t=>t.id===winner.id), a = Math.PI*2/wheelSlices.length;
  const start = rot % (Math.PI*2), target = Math.PI*2*6 - (idx+.5)*a, t0 = performance.now(), dur = 4200;
  spinning = true; $("#spinbtn").disabled = true;
  (function step(now){
    const p = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-p,4); rot = start+(target-start)*e; drawWheel();
    if (p<1) requestAnimationFrame(step); else { spinning = false; S.pick = {date:today(),id:winner.id}; save(); render(true); }
  })(t0);
}

  return subjBar() + `<div class="card hero"><div class="ringwrap">${ring(o,92,9,"rgba(255,255,255,.25)","#fff")}<div class="lab">${o}%</div></div>
      <div><b class="big">${o}% revised</b><span class="sub">${items.filter(t=>t.revs).length} of ${items.length} topics started</span>
      <div class="chips"><span class="chip">🔥 ${st.cur} day${st.cur===1?"":"s"}</span>${dueN?`<span class="chip">${dueN} due</span>`:""}${ex?`<span class="chip">${ex.d} days to ${S.view==="all"&&S.subjects.length>1?esc(ex.name):"exam"}</span>`:""}<span class="chip">${goalDots} ${n}/${S.goal} today</span></div></div></div>
    <div class="card"><div class="wheelwrap"><div class="ptr"></div><canvas id="wheel"></canvas></div>${panel}</div>
    ${pick && pick.notes ? `<div class="card"><div class="sub" style="text-transform:uppercase;letter-spacing:.06em;font-size:11px">Your note</div><div style="margin-top:4px">${esc(pick.notes)}</div></div>`:""}
    ${R.length?`<div class="card"><h2>${last?"Up next":"Where to start"}</h2><p>${last?`Related to <b>${esc(last.title)}</b>, plus what's due or weak.`:"Weakest and newest topics first."}</p>
      ${R.map(x=>`<div class="rec" data-a="revise" data-v="${x.t.id}"><i class="dot" style="--c:${colorOf(x.t)}"></i><div class="t">${esc(x.t.title)}<div class="sub" style="font-family:var(--font);font-weight:400">${esc(x.t.unit)}</div></div><span class="pill ${x.due?"due":""}">${recTag(x)}</span></div>`).join("")}</div>`:""}`;
}
function viewList(){
  if (!S.topics.length) return `<div class="card empty"><b>No topics yet</b><p>Import from Claude first.</p></div>`;
  const F = {all:()=>true,new:t=>!t.revs,weak:t=>t.revs&&t.pct<60,due:isDue,solid:t=>t.pct>=80};
  const groups = []; vis().forEach(t => { const k = t.sid+"|"+t.unit; let u = groups.find(x=>x.k===k); if(!u){u={k,unit:t.unit,sid:t.sid,items:[]};groups.push(u);} u.items.push(t); });
  const cnt = {}; Object.keys(F).forEach(k => cnt[k] = vis().filter(F[k]).length);
  return subjBar() + `<input class="search" id="q" type="text" placeholder="Search topics" autocomplete="off">
    <div class="filters">${[["all","All"],["new","Not started"],["weak","Needs work"],["due","Due"],["solid","Solid"]].map(([k,l])=>`<button class="${flt===k?"on":""}" data-a="flt" data-v="${k}">${l}${k!=="all"&&cnt[k]?` · ${cnt[k]}`:""}</button>`).join("")}</div>` +
    groups.map(u => { const items = u.items.filter(F[flt]); if (!items.length) return ""; const up = avg(u.items), s = subj(u.sid)||{name:"",color:"#6f7a83"};
      return `<details class="unit" style="--sc:${s.color}" ${openUnits.has(u.k)||flt!=="all"?"open":""} data-u="${esc(u.k)}"><summary><div class="row"><b class="sp">${esc(u.unit)}</b><em>${up}% · ${u.items.filter(t=>t.revs).length}/${u.items.length}</em></div>${S.view==="all"&&S.subjects.length>1?`<div class="tag">${esc(s.name)}</div>`:""}<div class="bar"><i style="width:${up}%"></i></div></summary>` +
      items.map(t => `<div class="item" data-a="revise" data-v="${t.id}" data-s="${esc(t.title.toLowerCase())}"><div class="badge" data-l="${level(t.pct)}">${t.revs?t.pct+"%":"–"}</div><div class="sp"><div class="t">${esc(t.title)}${isDue(t)?'<span class="pill due">Due</span>':""}</div><div class="m">${t.revs?`${t.revs} revision${t.revs===1?"":"s"} · ${ago(t.last)}`:"Not started"}</div></div></div>`).join("") + `</details>`; }).join("") +
    `<div style="text-align:center;margin-top:12px"><button class="ghost small" data-a="add">+ Add topic</button></div>`;
}
function viewProg(){
  if (!S.topics.length) return `<div class="card empty"><b>Nothing to show yet</b></div>`;
  const m = counts(), st = streaks(m), total = S.log.length, active = Object.keys(m).length, ex = nextExam();
  const end = new Date(); end.setHours(0,0,0,0); const start = new Date(end); start.setDate(start.getDate()-52*7-end.getDay());
  let cells = "", months = "", lastM = -1;
  for (let d = new Date(start); d <= new Date(end.getTime()+(6-end.getDay())*864e5); d.setDate(d.getDate()+1)) {
    const k = ymd(d), c = m[k]||0, l = c===0?0:c===1?1:c<=3?2:c<=5?3:4, fut = d>end;
    if (d.getDay()===0) { const mo = d.getMonth(); months += `<span>${mo!==lastM?d.toLocaleString("en",{month:"short"}):""}</span>`; lastM = mo; }
    cells += `<div class="cell ${fut?"future":""} ${k===selDay?"sel":""}" data-l="${l}" data-d="${k}" data-c="${c}"></div>`;
  }
  const items = vis(), weak = items.slice().sort((a,b)=>a.pct-b.pct).slice(0,5);
  const groups = []; items.forEach(t => { const k = t.sid+"|"+t.unit; let u = groups.find(x=>x.k===k); if(!u){u={k,unit:t.unit,sid:t.sid,items:[]};groups.push(u);} u.items.push(t); });
  const wk = S.log.filter(e=>sinceDays(e.d)<7).length, pw = S.log.filter(e=>{const n=sinceDays(e.d);return n>=7&&n<14}).length;
  const recent = S.log.slice(-5).reverse();
  return subjBar() + `<div class="stats"><div class="stat"><b>${st.cur}</b><span>current streak</span></div><div class="stat"><b>${st.best}</b><span>best streak</span></div><div class="stat"><b>${active}</b><span>days tracked</span></div></div>
    <div class="card"><div class="row" style="margin-bottom:10px"><b>${total} revision${total===1?"":"s"} logged</b><span class="sp"></span><span class="sub">${wk} this week · ${pw} last week</span></div>
      <div class="heat" id="heat"><div class="months">${months}</div><div class="grid">${cells}</div></div><div class="tip" id="tip">Tap a day for details.</div>
      <div class="legend">Less ${[0,1,2,3,4].map(l=>`<div class="cell" data-l="${l}"></div>`).join("")} More</div></div>
    ${ex?`<div class="card"><div class="row"><div class="big-pct">${ex.d}</div><div><b>days until ${esc(ex.name)}</b><div class="sub">${items.filter(t=>t.pct<70).length} topics below 70%</div></div></div></div>`:""}
    ${S.view==="all"&&S.subjects.length>1?`<h3>Subjects</h3><div class="card" style="margin-top:0">${S.subjects.map(s=>{const p=avg(S.topics.filter(t=>t.sid===s.id));return `<div class="list-row" data-a="view" data-v="${s.id}" style="cursor:pointer"><i class="dot" style="--c:${s.color}"></i><div class="t">${esc(s.name)}</div><div class="bar"><i style="width:${p}%;background:${s.color}"></i></div><div class="n">${p}%</div></div>`}).join("")}</div>`:""}
    <h3>Units</h3><div class="card" style="margin-top:0">${groups.map(u=>{const p=avg(u.items),s=subj(u.sid)||{color:"#6f7a83"};return `<div class="list-row"><i class="dot" style="--c:${s.color}"></i><div class="t">${esc(u.unit)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="n">${p}%</div></div>`}).join("")}</div>
    <h3>Needs work</h3><div class="card" style="margin-top:0">${weak.map(t=>`<div class="list-row" data-a="revise" data-v="${t.id}" style="cursor:pointer"><i class="dot" style="--c:${colorOf(t)}"></i><div class="t">${esc(t.title)}</div><div class="bar warn"><i style="width:${t.pct}%"></i></div><div class="n">${t.pct}%</div></div>`).join("")}</div>
    ${recent.length?`<h3>Recent</h3><div class="card" style="margin-top:0">${recent.map(e=>{const t=S.topics.find(x=>x.id===e.id);return t?`<div class="list-row"><i class="dot" style="--c:${colorOf(t)}"></i><div class="t">${esc(t.title)}</div><div class="n" style="width:auto">${e.d.slice(5)}</div></div>`:""}).join("")}</div>`:""}`;
}
function viewSync(){
  return `<div class="card"><h2>Load from Claude</h2><p>Claude already knows your subjects. Copy this prompt into a regular Claude chat, then paste its reply below. Every subject comes in at once, with colours, related topics and starting confidence.</p>
      <button class="full" data-a="cp-in">Copy prompt for Claude</button>
      <details class="how"><summary>See the prompt</summary><pre>${esc(PROMPT_IN)}</pre></details>
      <textarea id="paste" style="margin-top:10px" placeholder='Paste Claude&#39;s reply here'></textarea>
      <input type="text" id="isn" list="sl" style="margin-top:8px" placeholder="Subject name (only if Claude's reply doesn't include one)"><datalist id="sl">${S.subjects.map(s=>`<option value="${esc(s.name)}">`).join("")}</datalist>
      <label class="check"><input type="checkbox" id="replace" ${S.topics.length?"":"disabled"}> Replace those subjects' topics and progress (otherwise progress is kept and new topics merged in)</label>
      <button class="full" style="margin-top:10px" data-a="import">Import</button><div class="msg" id="imsg"></div></div>
    <div class="card"><h2>Tell Claude how it's going</h2><p>Copies your % revised per subject, streak, due topics, weak spots and full data. Paste it into Claude and it can acknowledge your progress and say what to do next.</p>
      <button class="ghost full" data-a="cp-out" ${S.topics.length?"":"disabled"}>Copy progress for Claude</button></div>`;
}
function viewSet(){
  return `<div class="card"><div class="row"><h2 class="sp">Subjects</h2><button class="ghost small" data-a="subj-new">+ Add</button></div><p>Each subject gets its own colour on the wheel and in your lists.</p>
      ${S.subjects.length?S.subjects.map(s=>`<div class="list-row" data-a="subj-edit" data-v="${s.id}" style="cursor:pointer"><i class="dot" style="--c:${s.color};width:14px;height:14px"></i><div class="t">${esc(s.name)}<div class="sub" style="font-family:var(--font);font-weight:400">${S.topics.filter(t=>t.sid===s.id).length} topics${s.examDate?" · exam "+esc(s.examDate):""}</div></div><span class="sub">Edit</span></div>`).join(""):`<div class="sub">No subjects yet.</div>`}</div>
    <div class="card"><h2>Appearance</h2><div class="sub" style="margin:6px 0">Theme colour</div>
      <div class="swatches">${Object.keys(THEMES).map(k=>`<button class="sw ${S.theme===k?"on":""}" style="--c:${THEMES[k].l[0]}" data-a="theme" data-v="${k}" aria-label="${THEMES[k].n}"></button>`).join("")}</div>
      <div class="sub" style="margin-bottom:6px">Mode</div>
      <div class="seg" style="margin-bottom:0">${[["system","System"],["light","Light"],["dark","Dark"]].map(([k,l])=>`<button class="${S.mode===k?"on":""}" data-a="mode" data-v="${k}">${l}</button>`).join("")}</div></div>
    <div class="card"><h2>Daily goal</h2>
      <div class="lbl"><span>Topics per day</span><span class="stepper"><button data-a="goal" data-v="-1">−</button><b id="gv">${S.goal}</b><button data-a="goal" data-v="1">+</button></span></div></div>
    <div class="card"><h2>Backup</h2><p>Copy all your data to keep it safe. To restore, paste a backup into the box on the Claude tab and press Import.</p>
      <div class="row"><button class="ghost small sp" data-a="backup">Copy backup</button><button class="ghost small sp" data-a="resetp">Reset progress</button></div></div>`;
}
function title(){
  if (S.view!=="all") return (subj(S.view)||{}).name || "Spinwise";
  return S.subjects.length===1 ? S.subjects[0].name : "Spinwise";
}
function render(keep){
  applyTheme();
  $("#logo").innerHTML = LOGO;
  $("#title").textContent = title();
  $("#subtitle").textContent = new Date().toLocaleDateString("en",{weekday:"long",day:"numeric",month:"long"});
  $("#main").innerHTML = tab==="today"?viewToday(keep):tab==="list"?viewList():tab==="prog"?viewProg():tab==="sync"?viewSync():viewSet();
  renderNav();
  if (tab==="today") drawWheel();
  if (tab==="list") {
    document.querySelectorAll("details.unit").forEach(d => d.addEventListener("toggle", () => d.open ? openUnits.add(d.dataset.u) : openUnits.delete(d.dataset.u)));
    const q = $("#q"); if (q) q.addEventListener("input", () => { const v = q.value.toLowerCase().trim();
      document.querySelectorAll("details.unit").forEach(d => { let any = false;
        d.querySelectorAll(".item").forEach(i => { const show = !v || i.dataset.s.includes(v); i.style.display = show?"":"none"; any = any||show; });
        d.style.display = any?"":"none"; if (v && any) d.open = true; }); });
  }
  if (tab==="prog") { const h = $("#heat"); if (h) h.scrollLeft = h.scrollWidth;
    document.querySelectorAll(".cell[data-d]").forEach(c => c.onclick = () => {
      document.querySelectorAll(".cell.sel").forEach(x=>x.classList.remove("sel")); c.classList.add("sel"); selDay = c.dataset.d;
      const dt = new Date(c.dataset.d+"T00:00:00").toLocaleDateString("en",{weekday:"short",day:"numeric",month:"short",year:"numeric"});
      const names = S.log.filter(e=>e.d===c.dataset.d).map(e=>(S.topics.find(t=>t.id===e.id)||{}).title).filter(Boolean);
      $("#tip").innerHTML = `<b style="color:var(--ink)">${names.length} revision${names.length===1?"":"s"}</b> on ${dt}`+(names.length?`<br>${names.map(esc).join(" · ")}`:""); }); }
}

/* ================= actions ================= */
const act = {
  tab(v){ if (spinning) return; tab = v; render(); window.scrollTo(0,0); },
  view(v){ if (spinning) return; S.view = v==="all" ? "all" : +v; wheelSlices = []; save(); render(); },
  wmode(v){ S.wmode = v; wheelSlices = []; save(); render(); },
  spin(){ spin(); },
  skip(){ S.pick = null; save(); render(); },
  again(){ S.pick = null; save(); render(); },
  undo(v){ undoRevision(+v); render(); toast("Revision undone"); },
  revise(v){ openRevise(+v); },
  close(){ closeModal(); },
  setpct(v){ $("#rg").value = v; $("#rg").dispatchEvent(new Event("input")); },
  dolog(v){ logRevision(+v,+$("#rg").value,$("#nt").value.trim()); closeModal(); wheelSlices = []; render(); toast("Revision logged"); },
  savenote(v){ const t = S.topics.find(x=>x.id===+v); t.notes = $("#nt").value.trim(); if (!t.revs) t.pct = +$("#rg").value; save(); closeModal(); render(); },
  resettopic(v){ const id = +v; ask("Reset this topic?","Reset",()=>{ const t = S.topics.find(x=>x.id===id); t.pct=0;t.revs=0;t.last=null; S.log = S.log.filter(e=>e.id!==id); save(); closeModal(); render(); }); },
  deltopic(v){ const id = +v; ask("Delete this topic?","Delete",()=>{ S.topics = S.topics.filter(x=>x.id!==id); S.log = S.log.filter(e=>e.id!==id); if (S.pick&&S.pick.id===id) S.pick=null; save(); closeModal(); wheelSlices = []; render(); }); },
  askyes(){ const cb = askCb; askCb = null; if (cb) cb(); },
  flt(v){ flt = v; render(); },
  add(){ openAdd(); },
  doadd(){ const t = $("#at").value.trim(), u = $("#au").value.trim()||"General", sid = +$("#as").value; if (!t) return;
    S.topics.push({id:nextId(),sid,unit:u,title:t,pct:0,revs:0,notes:"",last:null,rel:[]}); save(); closeModal(); wheelSlices = []; render(); toast("Topic added"); },
  "subj-new"(){ openSubject(null); },
  "subj-edit"(v){ openSubject(+v); },
  pickc(v){ editColor = v; document.querySelectorAll("#sws .sw").forEach(b => b.classList.toggle("on", b.dataset.v===v)); },
  subjsave(){ const name = $("#sn").value.trim(); if (!name) { toast("Give it a name"); return; }
    if (editSid===null) { const s = newSubject(name); s.color = editColor; s.examDate = $("#sx").value; S.view = s.id; }
    else { const s = subj(editSid); s.name = name; s.color = editColor; s.examDate = $("#sx").value; }
    save(); closeModal(); wheelSlices = []; render(); },
  subjdel(v){ const id = +v; ask("Delete this subject and all its topics?","Delete",()=>{ const ids = new Set(S.topics.filter(t=>t.sid===id).map(t=>t.id));
    S.topics = S.topics.filter(t=>t.sid!==id); S.log = S.log.filter(e=>!ids.has(e.id)); S.subjects = S.subjects.filter(s=>s.id!==id);
    if (S.pick && ids.has(S.pick.id)) S.pick = null; if (S.view===id) S.view = "all"; save(); closeModal(); wheelSlices = []; render(); }); },
  theme(v){ S.theme = v; save(); render(true); },
  mode(v){ S.mode = v; save(); render(true); },
  "cp-in"(){ copyText(PROMPT_IN); },
  "cp-out"(){ copyText(progressText()); },
  import(){ doImport(); },
  goal(v){ S.goal = Math.max(1,Math.min(10,S.goal+(+v))); save(); $("#gv").textContent = S.goal; },
  backup(){ copyText(JSON.stringify(Object.assign({},S,{version:3}))); },
  resetp(){ ask("Reset all progress?","Reset",()=>{ S.topics.forEach(t=>{t.pct=0;t.revs=0;t.last=null}); S.log=[]; S.pick=null; save(); closeModal(); tab="today"; wheelSlices = []; render(); }); }
};
document.addEventListener("click", e => { const el = e.target.closest("[data-a]"); if (!el) return; const f = act[el.dataset.a]; if (f) f(el.dataset.v, el); });
window.addEventListener("resize", () => tab==="today" && drawWheel());

/* ================= native bridge (widget) ================= */
function pushNative(){
  try { if (!window.Android || !Android.sync) return;
    const c = counts(), days = {}, d = new Date();
    for (let i=0;i<40;i++){ const k = ymd(d); if (c[k]) days[k] = c[k]; d.setDate(d.getDate()-1); }
    const p = todayPick();
    Android.sync(JSON.stringify({ subject:title(), pct:overall(), goal:S.goal, days, total:vis().length,
      pick: p ? { title:p.title, date:today(), logged:loggedToday(p.id) } : null }));
  } catch(e){}
}
render(); pushNative();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { if (tab==="today" && !spinning) drawWheel(); });
</script>
</body>
</html>
